function pitchSVGStatico(sq){
  const rows = [["A", sq.A, 66], ["C", sq.C, 164], ["D", sq.D, 262], ["P", sq.P, 348]];
  let g = "";
  for(const [role, nomi, y] of rows){
    nomi.forEach((nome, i) => {
      const x = 340/(nomi.length+1)*(i+1);
      const maxc = nomi.length >= 5 ? 7 : nomi.length === 4 ? 8 : 11;
      const nm = nome.length > maxc ? nome.slice(0, maxc-1)+"…" : nome;
      g += `<circle cx="${x}" cy="${y}" r="17" fill="var(--card)" stroke="${ROLE_COLOR[role]}" stroke-width="2"/>
        <text x="${x}" y="${y+34}" text-anchor="middle" font-size="14" font-weight="700" fill="var(--chalk)">${esc(nm)}</text>`;
    });
  }
  return `<svg viewBox="0 0 340 396" style="width:100%; max-height:460px">
    <rect x="8" y="8" width="324" height="380" rx="10" fill="var(--bg2)" stroke="var(--line)"/>
    <line x1="8" y1="30" x2="332" y2="30" stroke="var(--line)"/>
    <circle cx="170" cy="30" r="34" fill="none" stroke="var(--line)"/>
    <rect x="95" y="326" width="150" height="62" fill="none" stroke="var(--line)"/>
    <rect x="135" y="361" width="70" height="27" fill="none" stroke="var(--line)"/>${g}</svg>`;
}

function renderDettagliFormazione(){
  const ranking = MODULES.map(m => ({mod:m, lu:bestLineup(m)})).sort((a,b) => b.lu.ev - a.lu.ev);
  const sel = S.selMod ? ranking.find(x => x.mod.name === S.selMod) || ranking[0] : ranking[0];
  const titolariIds = new Set(sel.lu.xi.map(r => r.id));

  const sezioni = ROLES.map(role => {
    const giocatori = rosterByRole(role)
      .slice()
      .sort((a,b) => scheierability(b) - scheierability(a));
    if(!giocatori.length) return "";

    const righe = giocatori.map(r => {
      const st = S.byId.get(r.id);
      const e = expFV(r);
      const bonus = e.cal.adj + e.perf.val;
      const n11 = conteggioTop11(r.id, S.myTeamName);
      const titolare = titolariIds.has(r.id);
      const out = r.sq || r.inf;
      return `<div style="padding:10px 4px; border-bottom:1px solid var(--line); ${out?"opacity:.5":""}">
        <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px">
          <div style="font-weight:700; color:var(--chalk); overflow-wrap:anywhere">${esc(st.nome)}
            <span style="font-weight:400; color:var(--dim); font-size:12px">${esc(st.squadra||"")}</span></div>
          <span style="flex-shrink:0; font-size:11px; padding:2px 9px; border-radius:99px; white-space:nowrap; ${
            titolare ? "background:var(--fluo); color:var(--bg)" : "border:1px solid var(--line); color:var(--dim)"}">${
            titolare ? "titolare" : "panchina"}</span>
        </div>
        <div style="display:flex; gap:14px; margin-top:6px; font-size:12px; color:var(--dim); flex-wrap:wrap">
          <div><b style="color:var(--chalk)">${fmt(scheierability(r),2)}</b> schierab.</div>
          <div><b style="color:var(--chalk)">${fmt(indiceTitolarita(st)*100,0)}%</b> titolarità</div>
          <div><b style="color:${bonus>=0?"var(--fluo)":"var(--red)"}">${bonus>=0?"+":""}${fmt(bonus,2)}</b> bonus</div>
          <div><b style="color:var(--chalk)">${n11!=null?n11:"—"}×</b> Top11</div>
        </div>
      </div>`;
    }).join("");

    return `<div class="card" style="padding:8px 10px; margin-bottom:10px">
      <div class="l" style="padding:4px 4px 2px; color:${ROLE_COLOR[role]}">${ROLE_LABEL[role].toUpperCase()}</div>
      ${righe}
    </div>`;
  }).join("");

  el("main").innerHTML = `<h1>Dettagli Lineup</h1>
    <p class="sub" style="margin:0 0 14px">Modulo: <b style="color:var(--chalk)">${sel.mod.name}</b> —
      tutti i giocatori in rosa, titolari e panchina, con i calcoli del motore.</p>
    ${sezioni}`;
}

        <span class="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3z"/><path d="M3 6l9 7 9-7"/></svg></span>
        <span class="mtx"><b>Segnala un problema</b><i>Bug, dati strani, idee — mi arriva via email</i></span>
        <span class="mch">›</span>
      </a>
    </div>`;
}

function render(){
  const attivo = SOTTO_ALTRO.includes(S.tab) || SOTTO_ASTA.includes(S.tab) ? "altro" : SOTTO_FORMAZIONE.includes(S.tab) ? "formazione" : S.tab;
  document.querySelectorAll("nav button").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === attivo));
  ({rosa:renderRosa, giornata:renderGiornata, formazione:renderFormazione, altro:renderAltro,
    fattorec:renderFattoreC, sfida:renderSfida, mercato:renderMercato, cellha:renderCellHa, listone:renderListone, asta:renderAsta, regolelega:renderRegoleLega, top11:renderTop11, calendariolega:renderCalendarioLega,
    dettagliformazione:renderDettagliFormazione, piucomprati:renderPiuComprati,
    oggigiocherebbero:renderOggiGiocherebbero, oggigiocherebberosquadra:renderOggiGiocherebberoSquadra})[S.tab]();
  if(SOTTO_ASTA.includes(S.tab)){
    const m=el("main");
    const back=document.createElement("div");
    back.className="backlink";
    const versoLista = S.tab === "oggigiocherebberosquadra";
    back.innerHTML = versoLista ? "‹ Tutte le squadre" : "‹ Asta";
    back.onclick=()=>{ S.tab = versoLista ? "oggigiocherebbero" : "asta"; render(); };
    m.insertBefore(back, m.firstChild);
  } else if(SOTTO_ALTRO.includes(S.tab)){
    const m=el("main");
    const back=document.createElement("div");
    back.className="backlink";
    back.innerHTML="‹ Altro";
    back.onclick=()=>{ S.tab="altro"; render(); };
    m.insertBefore(back, m.firstChild);
  }
  if(SOTTO_FORMAZIONE.includes(S.tab)){
    const m=el("main");
    const back=document.createElement("div");
    back.className="backlink";
    back.innerHTML="‹ Formazione";
    back.onclick=()=>{ S.tab="formazione"; render(); };
    m.insertBefore(back, m.firstChild);
  }
}
document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => { S.tab = b.dataset.tab; render(); }));

/* ── THEME TOGGLE (dark/light) ── */
const htmlEl = document.documentElement;
const themeToggle = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('fantalitico-theme') || 'light';

function applyTheme(theme) {
  if (theme === 'dark') {
    htmlEl.classList.add('dark');
    themeToggle.textContent = '☀️';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0C1A12');
  } else {
    htmlEl.classList.remove('dark');
    themeToggle.textContent = '🌙';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F7F8F3');
  }
}

function toggleTheme() {
  const currentTheme = htmlEl.classList.contains('dark') ? 'dark' : 'light';
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(newTheme);
  localStorage.setItem('fantalitico-theme', newTheme);
}

applyTheme(savedTheme);

loadLocal();
loadData().then(render).catch(() => {
  el("main").innerHTML = `<div class="empty">⚠ Impossibile caricare i dati.<br>
    Verifica che la cartella <b>data/</b> con i JSON sia nel repository.</div>`;
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
