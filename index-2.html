<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fantalitico</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<meta name="theme-color" content="#F7F8F3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;900&family=Saira:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F7F8F3; --bg2:#EFF1E8; --card:#FFFFFF; --cardhi:#EAEEE1;
  --line:#DBE0D2; --chalk:#1E2A20; --dim:#71806E;
  --fluo:#4C7A3D; --amber:#B87A0A; --red:#C6433D; --cyan:#1E7E8C;
  --por:#D4A830; --dif:#2E7D32; --cen:#1565C0; --att:#D32F2F;
}
/* ── TEMA DARK (toggle) ── */
html.dark{
  --bg:#0C1A12; --bg2:#10231A; --card:#16301F; --cardhi:#1C3B27;
  --line:#2A4A35; --chalk:#EAF4EC; --dim:#9DB8A5;
  --fluo:#D8F651; --amber:#FFC24B; --red:#FF6B6B; --cyan:#6BD5E1;
  --por:#D4A830; --dif:#2E7D32; --cen:#1565C0; --att:#D32F2F;
}
/* Colori ruoli */
.role-por{color:var(--por); font-weight:900}
.role-dif{color:var(--dif); font-weight:900}
.role-cen{color:var(--cen); font-weight:900}
.role-att{color:var(--att); font-weight:900}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--bg); color:var(--chalk);
  font-family:'Saira',system-ui,sans-serif; padding-bottom:76px}
h1{font-family:'Saira Condensed',sans-serif; letter-spacing:.03em}
.wrap{max-width:520px; margin:0 auto; padding:0 12px}
header{position:sticky; top:0; z-index:40; background:var(--bg);
  border-bottom:1px solid var(--line); padding:14px 0 10px}
header .row{display:flex; justify-content:space-between; align-items:center}
h1{margin:0; font-size:26px; font-weight:900}
h1 .fluo{color:var(--fluo)}
.ver{font-size:11px; font-weight:900; color:var(--bg); background:var(--fluo);
  border-radius:6px; padding:1px 5px; margin-left:7px; vertical-align:super; letter-spacing:0}
.sub{font-size:12px; color:var(--dim); margin-top:2px}
.btn{background:var(--card); color:var(--fluo); border:1px solid var(--line);
  border-radius:10px; padding:8px 12px; font:700 12px 'Saira'; cursor:pointer;
  transition:background .15s, border-color .15s}
.btn:active{background:var(--cardhi)}
.btn.primary{background:var(--fluo); color:var(--bg); border-color:var(--fluo); font-size:15px; padding:12px 22px}
.btn:disabled{opacity:.5}
nav{position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:var(--bg2); border-top:1px solid var(--line)}
nav .wrap{display:flex; padding:0}
nav button{flex:1; background:none; border:none; color:var(--dim);
  padding:11px 0 max(11px, env(safe-area-inset-bottom)); cursor:pointer; font-family:'Saira';
  position:relative; transition:color .15s}
nav button.on{color:var(--fluo)}
.menu{display:flex; flex-direction:column; gap:10px; margin-top:14px}
.menurow{display:flex; align-items:center; gap:13px; background:var(--card); border:1px solid var(--line);
  border-radius:14px; padding:15px 14px; cursor:pointer}
.menurow:active{background:var(--cardhi)}
.menurow .mic{flex-shrink:0; width:24px; height:24px; color:var(--fluo); display:flex; align-items:center}
.menurow .mic svg{width:24px; height:24px; display:block}
.menurow .mtx{flex:1; display:flex; flex-direction:column; gap:2px}
.menurow .mtx b{font-size:16px; color:var(--chalk); font-weight:800}
.menurow .mtx i{font-style:normal; font-size:12.5px; color:var(--dim); line-height:1.35}
.menurow .mch{color:var(--dim); font-size:22px; flex-shrink:0}
.backlink{display:inline-flex; align-items:center; gap:5px; color:var(--fluo); font-weight:800;
  font-size:13.5px; cursor:pointer; margin-bottom:12px}
.ch-input{width:100%; box-sizing:border-box; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:13px 14px; color:var(--chalk); font-size:16px; font-family:inherit; margin:6px 0 14px}
.ch-input:focus{outline:none; border-color:var(--fluo)}
.ch-input::placeholder{color:var(--dim)}
.rolechips{display:flex; gap:6px}
.rolechip{flex:1; padding:8px 0; border-radius:9px; border:1px solid var(--line); background:var(--card);
  color:var(--dim); font-weight:800; font-size:13px; font-family:inherit}
.rolechip.on{background:var(--fluo); border-color:var(--fluo); color:var(--bg)}
.ch-hint,.ch-none{color:var(--dim); font-size:13.5px; line-height:1.5}
.ch-none{margin-top:8px; font-style:italic}
.ch-player{display:flex; align-items:center; gap:9px; margin-bottom:6px}
.ch-role{font-weight:900; font-size:13px; width:16px; flex-shrink:0}
.ch-player b{font-size:16px; color:var(--chalk)}
.ch-team{color:var(--dim); font-size:12.5px}
.ch-hit{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
.ch-hit.mine{opacity:.85}
.ch-lega{flex:1; font-weight:700; color:var(--chalk); font-size:14px}
.ch-squadra{color:var(--dim); font-size:13px}
.ch-wa{flex-shrink:0; background:#25925a; color:#fff; border:none; border-radius:9px;
  width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer}
.ch-wa:active{background:#1d7548}
.lst-meta{color:var(--dim); font-size:13px; margin-top:6px}
.lst-ruoli{display:flex; gap:14px; margin-top:10px; font-weight:800; font-size:14px}
.lst-ok{background:rgba(76,122,61,.12); border:1px solid var(--fluo); color:var(--chalk);
  border-radius:10px; padding:11px 13px; font-size:13.5px; margin-bottom:12px}
.lst-err{background:rgba(255,107,107,.12); border:1px solid var(--red); color:var(--chalk);
  border-radius:10px; padding:11px 13px; font-size:13.5px; margin-bottom:12px}
/* --- Appunti per l'asta --- */
.asta-top{display:flex; align-items:center; gap:14px; margin:6px 0 10px}
.asta-big{display:flex; flex-direction:column; line-height:1}
.asta-big .v{font-size:34px; font-weight:900; color:var(--fluo)}
.asta-big .l{font-size:11px; color:var(--dim); margin-top:3px}
.asta-slots{display:flex; gap:7px; margin-left:auto}
.asta-slot{display:flex; flex-direction:column; align-items:center; border:1.5px solid; border-radius:9px;
  padding:5px 9px; min-width:40px}
.asta-slot .r{font-weight:900; font-size:13px}
.asta-slot .n{font-size:12px; color:var(--chalk); margin-top:1px}
.asta-slot.full{background:rgba(76,122,61,.10)}
.asta-bar{height:6px; background:var(--card); border-radius:4px; overflow:hidden; margin-bottom:4px}
.asta-fill{height:100%; background:var(--fluo); transition:width .2s}
.asta-sub{font-size:12px; color:var(--dim); margin-bottom:10px}
.asta-cerca{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:5px; margin-bottom:14px}
.asta-hit{display:flex; align-items:center; gap:9px; padding:9px 8px; cursor:pointer; border-radius:8px}
.asta-hit:active{background:var(--cardhi)}
.asta-hit b{font-size:14.5px; color:var(--chalk)}
.asta-plus{margin-left:auto; color:var(--fluo); font-weight:900; font-size:20px}
.asta-rgroup{display:flex; align-items:center; justify-content:space-between; margin:16px 2px 8px;
  font-family:inherit; font-weight:900; font-size:15px}
.asta-rcount{font-size:12.5px; color:var(--dim); font-weight:700}
.asta-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:8px}
.asta-card.preso{opacity:.72; border-color:var(--fluo)}
.asta-row1{display:flex; align-items:center; gap:8px}
.asta-row1 b{font-size:15.5px; color:var(--chalk)}
.asta-team{font-size:12px; color:var(--dim)}
.asta-x{margin-left:auto; background:none; border:none; color:var(--dim); font-size:22px; cursor:pointer; line-height:1; padding:0 2px}
.asta-x:active{color:var(--red)}
.asta-row2{display:flex; align-items:center; gap:7px; margin-top:8px; flex-wrap:wrap}
.asta-tag{font-size:11.5px; font-weight:700; color:var(--chalk); background:var(--bg2); border:1px solid var(--line);
  border-radius:7px; padding:3px 8px}
.asta-tag.off{color:var(--dim)}
.asta-tit-wrap{display:flex; gap:4px; margin-left:auto}
.asta-tit{width:26px; height:26px; border:1px solid var(--line); background:var(--bg2); color:var(--dim);
  border-radius:7px; font-weight:900; font-size:12px; cursor:pointer}
.asta-tit.on{background:var(--fluo); color:var(--bg); border-color:var(--fluo)}
.asta-row3{display:flex; align-items:center; gap:8px; margin-top:9px}
.asta-quota{font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px}
.asta-quota input{width:56px; background:var(--bg2); border:1px solid var(--line); border-radius:7px;
  padding:6px 8px; color:var(--chalk); font-size:14px; font-family:inherit; text-align:center}
.asta-percmax{width:64px !important}
.asta-buy{margin-left:auto; display:flex; gap:6px}
.asta-prezzo{width:70px; background:var(--bg2); border:1px solid var(--line); border-radius:7px;
  padding:6px 8px; color:var(--chalk); font-size:14px; font-family:inherit; text-align:center}
.asta-preso{background:var(--fluo); color:var(--bg); border:none; border-radius:7px; padding:6px 12px;
  font-weight:800; font-size:13px; cursor:pointer}
.asta-row3.done{color:var(--chalk); font-size:13.5px}
.asta-row3.done b{color:var(--fluo)}
.asta-undo{margin-left:auto; background:none; border:none; color:var(--dim); font-size:12px; text-decoration:underline; cursor:pointer}
nav button.on::before{content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:30px; height:3px; border-radius:0 0 3px 3px; background:var(--fluo)}
nav .ico{height:34px; display:flex; align-items:center; justify-content:center}
nav .ico svg{width:32px; height:32px}
nav .lab{font-size:13px; font-weight:700; margin-top:4px; white-space:nowrap}
.rolehead{font-size:12px; letter-spacing:.18em; text-transform:uppercase;
  font-weight:800; padding:12px 4px 6px}
.card{background:var(--card); border-radius:14px; margin-bottom:8px; overflow:hidden}
.prow{display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; transition:background .12s}
.prow:active{background:var(--cardhi)}
.rball{width:32px; height:32px; border-radius:50%; background:var(--bg2);
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:12px; flex-shrink:0; border:1.5px solid}
.pmain{flex:1; min-width:0}
.pname{font-weight:700; font-size:15px; display:flex; align-items:baseline; gap:6px; min-width:0}
.pname .nametext{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.pteam{font-size:12px; color:var(--dim); font-weight:400; flex-shrink:0}
.chip{font-size:10px; font-weight:800; border-radius:99px; padding:1px 7px; border:1px solid; flex-shrink:0}
.chip.rig{color:var(--amber); border-color:var(--amber)}
.chip.out{color:var(--red); border-color:var(--red)}
.bar{height:5px; border-radius:99px; background:var(--line); margin-top:5px; position:relative}
.bar i{position:absolute; left:0; top:0; bottom:0; border-radius:99px; transition:width .35s ease}
.pnum{text-align:right; flex-shrink:0}
.pnum .v{font-size:18px; font-weight:900; font-variant-numeric:tabular-nums}
.pnum .l{font-size:9px; color:var(--dim)}
.pedit{padding:4px 14px 14px; font-size:13px; color:var(--dim); border-top:1px solid var(--line)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; margin:8px 0; font-variant-numeric:tabular-nums}
.grid2 b{color:var(--chalk)}
input[type=range]{width:100%; accent-color:var(--fluo); height:26px}
.togglerow{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap}
.tog{padding:7px 12px; border-radius:9px; font:700 12px 'Saira'; cursor:pointer;
  background:var(--bg2); color:var(--dim); border:1px solid var(--line)}
.tog.on{color:var(--bg); border-color:transparent; background:var(--fluo)}
.tog.on.red{background:var(--red)} .tog.on.amber{background:var(--amber)}
.tog.del{color:var(--red); border-color:var(--red); margin-left:auto}
.switch{position:relative; display:inline-block; width:44px; height:26px; flex-shrink:0}
.switch input{opacity:0; width:0; height:0}
.switch span{position:absolute; cursor:pointer; inset:0; background:var(--line);
  transition:.2s; border-radius:26px}
.switch span:before{position:absolute; content:""; height:20px; width:20px; left:3px; bottom:3px;
  background:var(--card); transition:.2s; border-radius:50%}
.switch input:checked + span{background:var(--fluo)}
.switch input:checked + span:before{transform:translateX(18px)}
.search{width:100%; background:var(--bg2); border:1px solid var(--line); color:var(--chalk);
  border-radius:12px; padding:12px 14px; font:600 15px 'Saira'; margin:10px 0 6px}
.search:focus{outline:2px solid var(--fluo)}
.hint{font-size:13px; color:var(--dim); padding:4px}
.srow{display:flex; align-items:center; gap:10px; padding:9px 12px}
.addbtn{background:var(--fluo); color:var(--bg); border:none; width:34px; height:34px;
  border-radius:10px; font-size:20px; font-weight:900; cursor:pointer; flex-shrink:0}
.addbtn:disabled{background:var(--line); color:var(--dim)}
.counter{display:flex; gap:6px; margin:8px 0; font-size:13px; font-variant-numeric:tabular-nums}
.counter span{background:var(--card); border-radius:8px; padding:4px 9px; color:var(--dim)}
.counter span.full{color:var(--fluo)}
.match{display:flex; align-items:center; padding:12px 16px}
.match .t{flex:1; font-weight:700}
.match .t.right{text-align:right}
.match .d{font-size:12px; font-variant-numeric:tabular-nums; margin:0 6px}
.match .vs{font-size:11px; color:var(--dim); padding:0 6px}
.pos{color:var(--fluo)} .neg{color:var(--red)}
.note{background:var(--bg2); border-radius:12px; padding:12px 14px; font-size:13px;
  color:var(--dim); line-height:1.5; margin-top:10px}
.modscroll{display:flex; gap:8px; overflow-x:auto; padding:12px 2px; scrollbar-width:none}
.modscroll::-webkit-scrollbar{display:none}
.modbtn{flex-shrink:0; border-radius:12px; padding:8px 13px; text-align:center; cursor:pointer;
  background:var(--card); color:var(--chalk); border:1px solid var(--line); font-family:'Saira'}
.modbtn.on{background:var(--fluo); color:var(--bg); border-color:var(--fluo)}
.modbtn .n{font-weight:900; font-size:15px}
.modbtn .e{font-size:11px; font-variant-numeric:tabular-nums; opacity:.75}
.bighead{display:flex; justify-content:space-between; align-items:baseline; padding:12px 14px 0}
.bighead .l{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim)}
.bighead .v{font-size:24px; font-weight:900; font-variant-numeric:tabular-nums}
.mcgrid{display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center; padding:10px 0 4px;
  font-variant-numeric:tabular-nums}
.mcgrid .v{font-size:18px; font-weight:900}
.mcgrid .l{font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
.thres{border-top:1px solid var(--line); margin:10px 14px 0; padding:12px 0 14px}
.thres .row{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; color:var(--dim)}
.thres .p{font-size:24px; font-weight:900; font-variant-numeric:tabular-nums}
.center{text-align:center; padding:22px 16px}
.center .big{font-size:34px}
.empty{padding:40px 20px; text-align:center; color:var(--dim); line-height:1.6}
.ill{width:112px; height:112px; display:block; margin:0 auto 14px; opacity:.95}
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50;
  display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--bg2); width:100%; max-width:520px; border-radius:18px 18px 0 0;
  padding:20px; max-height:80vh; overflow-y:auto; font-size:14px; line-height:1.55; color:var(--dim)}
.sheet h3{color:var(--chalk); margin:0 0 10px; font-size:18px}
.sheet b{color:var(--fluo)}
.updated{font-size:10px; color:var(--dim); text-align:center; padding:6px 0 2px}
.importbar{display:flex; align-items:center; gap:10px; padding:8px 3px 4px; flex-wrap:wrap}
.importbar .myteam{font-size:12px; color:var(--dim)}
.importbar .myteam b{color:var(--fluo)}
.leaguebar{display:flex; gap:6px; overflow-x:auto; padding:10px 3px 2px; scrollbar-width:none}
.leaguebar::-webkit-scrollbar{display:none}
.lchip{flex-shrink:0; background:var(--card); color:var(--chalk); border:1px solid var(--line);
  border-radius:99px; padding:6px 13px; font:700 12px 'Saira'; cursor:pointer; white-space:nowrap}
.lchip.on{background:var(--fluo); color:var(--bg); border-color:var(--fluo)}
.lchip.add{color:var(--fluo)}
.lchip.del{color:var(--red); border-color:var(--red); font-size:11px; padding:5px 10px}
.lchip.chg{font-size:10px; padding:3px 8px; color:var(--fluo); border-color:var(--line)}
.teampick{display:flex; justify-content:space-between; align-items:center; width:100%;
  background:var(--bg2); color:var(--chalk); border:1px solid var(--line); border-radius:10px;
  padding:11px 13px; margin-top:6px; font:700 14px 'Saira'; cursor:pointer}
.teampick:active{background:var(--cardhi)}
.teampick .tp-n{font-size:11px; color:var(--dim); font-weight:600}
.oppsel{width:100%; background:var(--card); color:var(--chalk); border:1px solid var(--line);
  border-radius:12px; padding:12px 14px; font:700 15px 'Saira'; -webkit-appearance:none; appearance:none}
.vsrow{display:flex; align-items:center; text-align:center}
.vsside{flex:1; min-width:0}
.vsname{font-weight:800; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.vstot{font-size:30px; font-weight:900; font-variant-numeric:tabular-nums; margin-top:2px}
.vsmid{flex:0 0 96px; padding:0 4px}
.wp{font-size:26px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1}
.wplab{font-size:9px; text-transform:uppercase; letter-spacing:.14em; color:var(--dim)}
.vsmod{font-size:10px; color:var(--dim); margin-top:5px}
.cmpgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
.cmphead{font-size:13px; text-transform:uppercase; letter-spacing:.1em; font-weight:800; color:var(--dim); margin-bottom:6px; line-height:1.3; min-height:2.6em; display:flex; align-items:flex-end}
.minixi{display:flex; flex-direction:column; gap:3px}
.mline{display:flex; align-items:center; gap:6px; font-size:14px; padding:1px 0}
.mrole{font-weight:900; width:15px; flex-shrink:0}
.mname{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mval{font-weight:800; font-variant-numeric:tabular-nums; flex-shrink:0}
.mkhint{font-size:13px; color:var(--dim); padding:2px 4px 8px; line-height:1.4}
.mkline{display:flex; align-items:center; gap:8px; padding:6px 10px}
.mkteam{font-size:12px; color:var(--dim); font-weight:400}
.mkstat{text-align:center; font-weight:800; font-variant-numeric:tabular-nums; font-size:14px; flex-shrink:0; min-width:38px}
.mkstat .mksub{display:block; font-size:8px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.06em}
.mkdelta{font-weight:900; font-variant-numeric:tabular-nums; font-size:13px; flex-shrink:0; min-width:42px; text-align:right}
.mktag{font-size:9px; font-weight:800; border:1px solid; border-radius:99px; padding:1px 6px; flex-shrink:0}
.mkarrow{font-size:11px; color:var(--dim); text-align:center; padding:2px 0}
svg{display:block}
</style>
</head>
<body>
<header><div class="wrap row">
  <div>
    <h1>FANTA<span class="fluo">LITICO</span></h1>
    <div class="sub" id="subtitle">caricamento dati…</div>
  </div>
  <button class="btn" onclick="openMetodo()" style="margin-right:8px">Metodo ƒ(x)</button>
  <button class="btn" id="themeToggle" onclick="toggleTheme()" title="Cambia tema" style="padding:8px; font-size:20px">🌙</button>
</div></header>

<main class="wrap" id="main"></main>
<input type="file" id="leaguefile" accept=".xlsx,.xls" style="display:none" onchange="onLeagueFile(this)">

<script>
"use strict";
/* ============ FANTALITICO — motore probabilistico ============ */
const ROLES = ["P","D","C","A"];
const ROLE_LABEL = {P:"Portieri", D:"Difensori", C:"Centrocampisti", A:"Attaccanti"};
const ROLE_COLOR = {P:"var(--por)", D:"var(--dif)", C:"var(--cen)", A:"var(--att)"};
const ROLE_MAX = {P:3, D:8, C:8, A:6};
/* ============================================================
   COSTANTI DEL MOTORE — taratura del 17/07/2026
   Misurate su 10.504 fantavoti reali (Serie A 2025-26, 37 giornate)
   incrociati con Understat. Vedi METODO.md, Parte 3.
   ============================================================ */

// Volatilità del fantavoto per ruolo (σ). MISURATE.
const SIGMA = {P:1.55, D:1.07, C:1.33, A:1.90};

// Fantamedia media della popolazione per ruolo. MISURATI.
const PRIOR = {P:5.02, D:5.99, C:6.20, A:6.53};

// Forza dello shrinkage, per ruolo. Bayes empirico: K* = σ²(rumore) / σ²(vere differenze).
// Il rumore di giornata è 10-28× le vere differenze tra giocatori dello stesso ruolo:
// per questo si restringe molto più di quanto (K=8) assumessi prima.
const K_SHRINK = {P:28, D:16, C:15, A:19};

// Forza della PROPRIA squadra (γ). Sopravvive al controllo per la fantamedia passata
// in ogni ruolo → non è doppio conteggio. Applicata a (forza − 0,5), quindi ±γ/2.
const GAMMA_TEAM = {P:0.476, D:0.432, C:0.436, A:0.464};

// Forza dell'AVVERSARIO. Fortemente dipendente dal ruolo: un portiere è colpito
// 2,3× più di un centrocampista. Applicata a (forza_avv − 0,5).
const OPP_W = {P:-1.018, D:-0.534, C:-0.444, A:-0.891};

// Scarto casa−trasferta. Applicato a (casa − 0,5), quindi ±HOME/2 ≈ ±0,08.
// La versione precedente (±0,15) raddoppiava il vantaggio del campo.
const HOME_W = {P:0.167, D:0.172, C:0.144, A:0.155};

// NON ricalibrate: RIG_BONUS (campione n<10, troppo fragile) e BENCH_FV
// (va ripensato in funzione delle regole di sostituzione della lega, non ritarato).
const BENCH_FV = 4.0, RIG_BONUS = 0.3, N_SIM = 3000;

/* ============================================================
   MODIFICATORE DI DIFESA — meccanismo reale fantacalcio.it
   Fonte: regolamento ufficiale leghe.fantacalcio.it + riscontri incrociati
   (FantaMaster, SOS Fanta, Goal.com). Si attiva SOLO con almeno 4 difensori
   schierati (moduli a 3 esclusi). Si calcola la MEDIA del voto PURO (senza
   bonus/malus) di portiere + 3 migliori difensori tra quelli schierati
   (scartando il peggiore se sono esattamente 4). Quella media cade in una
   fascia (configurabile in Regole Lega) che dà un bonus/malus UNICO
   all'intera squadra — non è distribuito sui singoli giocatori.
   ============================================================ */
function defModTeamBonus(votoP, votiD){
  if(!S.leagueRules?.defMod?.enabled) return 0;
  if(votoP == null || votiD.length < 4) return 0;             // serve il portiere + almeno 4 difensori
  const validi = votiD.filter(v => v != null);
  if(validi.length < 4) return 0;
  const best3 = [...validi].sort((a,b) => b-a).slice(0,3);
  const media = (votoP + best3.reduce((s,v) => s+v, 0)) / 4;
  const fasce = [...(S.leagueRules.defMod.fasce||[])].sort((a,b) => a.min-b.min);
  const f = fasce.find(f => media >= f.min && media <= f.max);
  return f ? f.val : 0;
}

/* ============================================================
   BONUS CAPITANO — configurabile, disattivabile
   ============================================================ */
function pickCaptain(xi){
  if(!S.leagueRules?.captain?.enabled || !xi || !xi.length) return null;
  return xi.reduce((best, r) => scheierability(r) > scheierability(best) ? r : best, xi[0]);
}
function pickViceCaptain(xi, captain){
  if(!S.leagueRules?.captain?.enabled || !S.leagueRules?.captain?.vice || !xi || !captain) return null;
  const rest = xi.filter(r => r.id !== captain.id);
  if(!rest.length) return null;
  return rest.reduce((best, r) => scheierability(r) > scheierability(best) ? r : best, rest[0]);
}
function fasceBonus(voto){
  const fasce = [...(S.leagueRules.captain.fasce||[])].sort((a,b) => a.min-b.min);
  if(!fasce.length) return 0;
  const f = fasce.find(f => voto >= f.min && voto <= f.max);
  return f ? f.val ?? f.bonus : 0;
}
function captainAdjustedValue(rating){                 // uso prospettico (Formazione): solo su rating previsto
  const c = S.leagueRules.captain;
  if(c.type === "raddoppio") return rating*2;
  if(c.type === "fasce") return rating + fasceBonus(rating);   // stima: fascia letta sul rating previsto
  return rating + (Number(c.fixedValue)||0);
}
function captainAdjustedValueReal(voto, fv){
  // uso retrospettivo (Top 11): voto e fantavoto REALI, con raddoppio bonus/malus se attivo.
  // APPROSSIMAZIONE dichiarata: non conosciamo il valore in punti di ogni singolo bonus/malus
  // (solo il conteggio eventi), quindi trattiamo l'intero delta FV-V come "bonus" se positivo,
  // "malus" se negativo, e lo raddoppiamo di conseguenza. Da verificare quando la lega è configurata.
  const c = S.leagueRules.captain;
  if(c.type === "raddoppio") return fv*2;
  if(c.type === "fisso") return fv + (Number(c.fixedValue)||0);
  // fasce
  const delta = fv - voto;
  const adjDelta = delta >= 0 ? (c.raddoppiaBonus ? delta*2 : delta) : (c.raddoppiaMalus ? delta*2 : delta);
  return voto + fasceBonus(voto) + adjDelta;
}

/* ============================================================
   VOTI REALI STORICI — letti da voti_storico.json (giornate già giocate)
   ============================================================ */
function realFV(playerId, giornata){
  const p = S.votiStorico[playerId];
  if(!p) return null;
  const g = p.giornate?.[String(giornata)];
  return g && g.fantavoto_consensus != null ? g.fantavoto_consensus : null;
}
function realVoto(playerId, giornata){
  const p = S.votiStorico[playerId];
  if(!p) return null;
  const g = p.giornate?.[String(giornata)];
  return g && g.voto_consensus != null ? g.voto_consensus : null;
}
function realRecentForm(playerId, n=5){                // ultime n giornate con voto reale, più recente prima
  const p = S.votiStorico[playerId];
  if(!p || !p.giornate) return [];
  return Object.keys(p.giornate)
    .map(Number).sort((a,b) => b-a)
    .map(g => ({giornata:g, fv:p.giornate[String(g)].fantavoto_consensus}))
    .filter(x => x.fv != null)
    .slice(0, n);
}
function availableGiornate(){                          // elenco giornate con almeno un voto reale, più recente prima
  const set = new Set();
  Object.values(S.votiStorico||{}).forEach(p => Object.keys(p.giornate||{}).forEach(g => set.add(Number(g))));
  return Array.from(set).sort((a,b) => b-a);
}

const MODULES = [

  {name:"4-5-1", d:4, c:5, a:1},
];

/* Allinea le "viste attive" (roster/leagueRosters/myTeamName) alla lega corrente.
   Usa la STESSA referenza dell'array, così le modifiche si propagano da sole. */
function syncActive(){
  const L = S.currentLeague && S.leagues[S.currentLeague];
  if(L){ S.roster = L.roster; S.leagueRosters = L.rosters; S.myTeamName = L.myTeam;
    if(!L.calendar) L.calendar = {};
    S.leagueCalendar = L.calendar; }
  else { S.roster = S.standalone; S.leagueRosters = {}; S.myTeamName = null; S.leagueCalendar = {}; }
}

/* ---------- persistenza ---------- */
function saveLocal(){
  if(S.currentLeague && S.leagues[S.currentLeague]) S.leagues[S.currentLeague].myTeam = S.myTeamName;
  localStorage.setItem("fantalitico", JSON.stringify(
    {threshold:S.threshold, thresholdSetByUser:S.thresholdSetByUser, leagues:S.leagues, currentLeague:S.currentLeague, standalone:S.standalone,
     listone:S.listone, extraNames:S.extraNames, asta:S.asta, leagueRules:S.leagueRules}));
}
function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem("fantalitico") || "{}");
    if(d.threshold && d.thresholdSetByUser){ S.threshold = d.threshold; S.thresholdSetByUser = true; }
    if(d.standalone) S.standalone = d.standalone;
    if(d.extraNames) S.extraNames = d.extraNames;
    if(d.asta) S.asta = d.asta;
    if(d.leagueRules){
      // Merge difensivo: uno stato salvato PRIMA di un aggiornamento può non avere
      // i campi nuovi (es. fasce, vice). Sovrascrivere in blocco romperebbe la UI.
      S.leagueRules.captain = {...S.leagueRules.captain, ...(d.leagueRules.captain||{})};
      S.leagueRules.defMod  = {...S.leagueRules.defMod,  ...(d.leagueRules.defMod||{})};
      if(!Array.isArray(S.leagueRules.captain.fasce) || !S.leagueRules.captain.fasce.length){
        S.leagueRules.captain.fasce = [{min:6.5,max:6.99,bonus:0},{min:7,max:7.49,bonus:1},{min:7.5,max:7.99,bonus:2},{min:8,max:99,bonus:2}];
      }
      if(!Array.isArray(S.leagueRules.defMod.fasce) || !S.leagueRules.defMod.fasce.length){
        S.leagueRules.defMod.fasce = [{min:6,max:6.49,val:1},{min:6.5,max:6.99,val:3},{min:7,max:99,val:6}];
      }
    }
    if(d.listone && d.listone.giocatori){
      S.listone = d.listone;
      S.listone.giocatori.forEach(g => S.listoneById.set(g.id, g));
    }
    if(d.leagues && Object.keys(d.leagues).length){
      S.leagues = d.leagues; S.currentLeague = d.currentLeague || Object.keys(d.leagues)[0];
    } else if(d.leagueRosters && Object.keys(d.leagueRosters).length){
      // migrazione dal vecchio formato a lega singola
      const nome = "La mia lega";
      S.leagues[nome] = {rosters:d.leagueRosters, myTeam:d.myTeamName||null, roster:Array.isArray(d.roster)?d.roster:[]};
      S.currentLeague = nome;
    } else if(Array.isArray(d.roster)){
      S.standalone = d.roster;
    }
    syncActive();
  }catch(e){}
}

/* ---------- caricamento dati pipeline ---------- */
async function getJSON(name){
  const r = await fetch("data/" + name, {cache:"no-store"});
  if(!r.ok) throw new Error(name + ": " + r.status);
  return r.json();
}
const normName = s => (s||"").toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");

async function loadData(){
  const res = await Promise.allSettled([
    getJSON("players.json"), getJSON("classifica.json"), getJSON("calendario.json"),
    getJSON("rigoristi.json"), getJSON("indisponibili.json"), getJSON("meta.json"),
    getJSON("understat.json"), getJSON("voti_storico.json"), getJSON("storico_presenze.json"),
    getJSON("titolarita_reale.json"), getJSON("prezzi_reali_asta.json"),
  ]);
  const [pl, cl, cal, rig, ind, meta, us, vs, sp, tr, pa] = res.map(r => r.status==="fulfilled" ? r.value : null);

  if(pl){
    S.db = pl.giocatori.filter(p => p.id && p.nome);
    S.db.forEach(p => S.byId.set(p.id, p));
  }
  syncExtraNamesIntoById();  // giocatori non riconosciuti (ID sintetico "x:..."): stub sicuro, mai undefined
  // Ripropaga fuoriSerieA dal listone già salvato (loadLocal gira PRIMA di questo
  // punto): altrimenti il flag si perde a ogni riavvio, perché S.byId viene
  // ricostruito da zero da players.json ogni volta, senza sapere nulla del listone.
  if(S.listone && S.listone.giocatori){
    for(const g of S.listone.giocatori){
      if(g.fuoriSerieA && S.byId.has(g.id)) S.byId.get(g.id).fuoriSerieA = true;
    }
  }
  if(cl){
    // mappa nome classifica → slug squadra dei giocatori
    const slugs = [...new Set(S.db.map(p => p.squadra))];
    cl.classifica.forEach(row => {
      const n = normName(row.squadra);
      const slug = slugs.find(s => n.includes(normName(s)) || normName(s).includes(n));
      if(slug) S.points[slug] = row.punti;
    });
  }
  if(cal) S.fixtures = cal.partite || [];
  if(rig) S.rigoristi = rig.rigoristi || {};
  if(ind) S.indisponibili = ind.squadre || {};   // { team: {squalificati:[{nome,id}], diffidati:[...], infortunati:[{nome,id,dettaglio}], dubbio:[...]} }
  if(us && us.giocatori){                      // feed offensivo: { giocatori: { cod: {shots_p90, xa_p90} } }
    S.understat = us.giocatori;
  }
  if(vs) S.votiStorico = vs;                    // storico voti reali per giornata: { player_id: {nome,squadra,ruolo,giornate:{...}} }
  if(sp && sp.giocatori) S.storicoPresenze = sp.giocatori;  // { player_id: {nome,squadra,pv,rateo} } stagione precedente
  if(tr && tr.giocatori) S.titolarita_reale = tr.giocatori;  // { player_id: {nome,squadra,confidence,...} } consensus probabili formazioni
  if(pa && pa.giocatori) S.prezziRealiAsta = pa.giocatori;   // { player_id: {percMax, comprato_pct, prezzo_500,...} } fantacalcio-online.com
  S.meta = meta;

  const dt = pl ? new Date(pl.aggiornato) : null;
  document.getElementById("subtitle").textContent = pl
    ? `${S.db.length} giocatori · dati ${dt.toLocaleDateString("it-IT")}`
    : "⚠ dati non raggiungibili";
}

/* ---------- motore ---------- */
function playerSlugOf(p){                    // slug del giocatore dal nome (per rigoristi/indisponibili)
  return normName(p.nome).replace(/\./g,"");
}
function ptsRange(){
  const v = Object.values(S.points);
  return v.length ? [Math.min(...v), Math.max(...v)] : [0, 1];
}
function strength(teamSlug){
  const [lo, hi] = ptsRange();
  const p = S.points[teamSlug];
  return p == null || hi === lo ? 0.5 : (p - lo) / (hi - lo);
}
function matchInfo(teamSlug){
  for(const f of S.fixtures){
    if(f.casa === teamSlug) return {opp:f.trasferta, home:true};
    if(f.trasferta === teamSlug) return {opp:f.casa, home:false};
  }
  return null;
}
/* Δ della giornata: dipende dal RUOLO, perché avversario e campo non colpiscono tutti uguale.
   A campionato fermo (nessuna partita) vale 0; senza classifica strength()=0,5 → contributo nullo. */
function calAdj(teamSlug, role){
  const m = matchInfo(teamSlug);
  if(!m) return {adj:0, opp:null, home:null};    // campionato fermo o squadra a riposo
  const adj = HOME_W[role] * (m.home ? .5 : -.5)
            + OPP_W[role]  * (strength(m.opp) - 0.5);
  return {adj, opp:m.opp, home:m.home};
}
function calAdjAvg(teamSlug){                    // media sui ruoli, per la vista Giornata
  const m = matchInfo(teamSlug);
  if(!m) return {adj:0, opp:null, home:null};
  const adj = ROLES.reduce((s,r) => s + calAdj(teamSlug, r).adj, 0) / ROLES.length;
  return {adj, opp:m.opp, home:m.home};
}
/* Rating del giocatore: shrinkage bayesiano verso il prior di ruolo, con K per ruolo. */
function shrunk(st){
  const role = roleOf(st), pg = st.pv || 0, fm = st.fm ?? PRIOR[role], K = K_SHRINK[role];
  // Prior "personale": la fantamedia storica (se c'è) smussata verso il prior di ruolo,
  // pesata da quante presenze storiche il giocatore ha (K identico, stesso principio dello
  // shrinkage stagionale). Senza storico resta il prior di ruolo puro, come prima.
  const storico = S.storicoPresenze && S.storicoPresenze[st.id];
  const priorPersonale = (storico && storico.fm != null)
    ? (storico.pv*storico.fm + K*PRIOR[role]) / (storico.pv + K)
    : PRIOR[role];
  return (pg*fm + K*priorPersonale) / (pg + K);
}
/* Forza della PROPRIA squadra. È un attributo del giocatore (varia 0,005 dentro la stagione),
   non un fattore di giornata: entra nel rating, non nel Δ calendario.
   Senza classifica caricata strength() restituisce 0,5 → il termine si annulla da solo. */
function teamAdj(st){
  return GAMMA_TEAM[roleOf(st)] * (strength(st.squadra) - 0.5);
}
function roleOf(st){ return st ? (st.ruolo || "C") : "?"; }
function perfBonus(st){                          // bonus da statistiche Understat role-specific
  const role = roleOf(st), w = PERF_W.ruoli[role], u = S.understat[st.id];
  if (!w || !u) return { val: 0, has: false };   // nessun feed (es. campionato fermo) → 0
  const fvsd = PERF_W.FV_sd[role] || 0;
  let b = 0, used = false;
  
  // Metriche specifiche per ruolo
  let metrics = ["shots_p90", "xa_p90"];  // Default
  if(role === "A") metrics = ["shots_p90", "xa_p90", "xg_p90"];  // Attaccanti: aggiungi xG
  if(role === "C") metrics = ["xa_p90", "tackles_interceptions_p90", "passes_progressive_p90"];  // Centrocampisti
  if(role === "D") metrics = ["tackles_interceptions_p90", "xga_90", "clearances_p90"];  // Difensori
  if(role === "P") metrics = ["xga_90", "shots_on_target_p90"];  // Portieri (no save_rate, non disponibile)
  
  for (const sig of metrics) {
    const c = w[sig];
    if (!c || !c.beta || u[sig] == null) continue;
    const z = Math.max(-PERF_W.cap, Math.min(PERF_W.cap, (u[sig] - c.mean) / c.sd));
    b += c.beta * fvsd * z; used = true;
  }
  return { val: b, has: used };
}

function scheierability(r){                     // Indice di Schierabilità: "Se gioca, quanto varrà?"
  const st = S.byId.get(r.id);
  const base = expFV(r).val;                    // shrunk + teamAdj + calAdj + perfBonus + rig + defMod
  return base * indiceTitolarita(st);            // stesso IT usato ovunque nell'app
}

function expFV(r){                               // r = elemento roster
  const st = S.byId.get(r.id);
  const role = roleOf(st);
  const cal = calAdj(st.squadra, role);
  const team = teamAdj(st);                      // contesto squadra (costante nella stagione)
  const perf = perfBonus(st);
  const base = shrunk(st) + team;                // rating di giocatore = fantamedia ristretta + squadra
  return { val: base + cal.adj + (r.rig ? RIG_BONUS : 0) + perf.val,
           cal, base, team, rating: shrunk(st), st, perf };
}
function slotEV(r){
  return (r.pTit/100) * expFV(r).val + (1 - r.pTit/100) * BENCH_FV;
}
function rosterByRole(role){
  return S.roster.filter(r => roleOf(S.byId.get(r.id)) === role);
}
function bestLineup(mod){
  // FORMAZIONE = motore puro: solo schierabilità (performance + titolarità),
  // nessuna regola di lega (capitano/modificatore). Quelle vivono in Top 11/Sfida,
  // dove ha senso che dipendano da come gioca la tua lega specifica.
  const avail = S.roster.filter(r => !r.sq && !r.inf);
  const by = role => avail.filter(r => roleOf(S.byId.get(r.id)) === role)
    .sort((a,b) => scheierability(b) - scheierability(a));
  const xi = [...by("P").slice(0,1), ...by("D").slice(0,mod.d),
              ...by("C").slice(0,mod.c), ...by("A").slice(0,mod.a)];
  const need = 1 + mod.d + mod.c + mod.a;
  const bench = {};
  ROLES.forEach(role => bench[role] = by(role).filter(r => !xi.includes(r)));
  return {xi, bench, complete: xi.length === need,
          ev: xi.reduce((s,r) => s + scheierability(r), 0) - (xi.length === need ? 0 : 99)};
}
function gauss(){
  let u = 0, v = 0;
  while(!u) u = Math.random();
  while(!v) v = Math.random();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}
function monteCarlo(lu){
  const totals = new Float64Array(N_SIM);
  const xi = lu.xi.map(r => ({p:r.pTit/100, e:expFV(r).val, s:SIGMA[roleOf(S.byId.get(r.id))], role:roleOf(S.byId.get(r.id))}));
  const bench = {};
  ROLES.forEach(role => bench[role] = lu.bench[role].map(r =>
    ({e:expFV(r).val, s:SIGMA[role]})));
  for(let i=0; i<N_SIM; i++){
    let tot = 0; const used = {P:0,D:0,C:0,A:0};
    for(const x of xi){
      if(Math.random() < x.p) tot += x.e + x.s*gauss();
      else{
        const sub = bench[x.role][used[x.role]++];
        tot += sub ? sub.e*0.97 + sub.s*gauss() : 0;
      }
    }
    totals[i] = tot;
  }
  const s = Array.from(totals).sort((a,b) => a-b);
  const q = x => s[Math.floor(x*(N_SIM-1))];
  return {sorted:s, mean:s.reduce((a,b)=>a+b,0)/N_SIM, p10:q(.1), p50:q(.5), p90:q(.9)};
}

/* ---------- LEGA: import rose + confronto ---------- */
function teamMatch(abbr, slug){       // per risolvere le omonimie con la squadra
  const a=normName(abbr), b=normName(slug);
  if(!a||!b) return false;
  return b.startsWith(a.slice(0,3)) || a.startsWith(b.slice(0,3)) || b.includes(a) || a.includes(b);
}
/* ---- LISTONE UFFICIALE: parser del file quotazioni ---- */
function parseListoneSheet(ws, forzaFuoriSerieA){
  if(!ws) return [];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  let h=-1;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const up=(rows[i]||[]).map(x=>String(x||"").toLowerCase());
    if(up.includes("id") && up.includes("nome")){ h=i; break; }
  }
  if(h<0) return [];   // foglio senza intestazione riconoscibile (es. non presente in vecchie versioni del file)
  const H=rows[h].map(x=>String(x||"").toLowerCase().trim());
  const ci = n => H.indexOf(n);
  const cId=ci("id"), cR=ci("r"), cNome=ci("nome"), cSq=ci("squadra"), cQt=ci("qt.a"), cFvm=ci("fvm");
  if(cId<0||cNome<0) return [];
  const giocatori=[];
  for(let i=h+1;i<rows.length;i++){
    const r=rows[i]||[];
    const id=r[cId], nomeGrezzo=r[cNome];
    if(id==null||nomeGrezzo==null||String(nomeGrezzo).trim()==="") continue;
    // Asterisco (*) accodato al nome: convenzione storica fantacalcio.it per i giocatori
    // usciti dalla Serie A. Tenuta per compatibilità, ma il meccanismo osservato nella
    // stagione 2026-27 è un foglio Excel dedicato ("Ceduti") — vedi forzaFuoriSerieA.
    const nomeStr = String(nomeGrezzo).trim();
    const fuoriSerieA = forzaFuoriSerieA || /\s*\*\s*$/.test(nomeStr);
    giocatori.push({
      id: typeof id==="number"? id : (parseInt(id,10)||id),
      nome: nomeStr.replace(/\s*\*\s*$/,"").trim(),
      squadra: cSq>=0 ? String(r[cSq]||"").trim() : "",
      ruolo: cR>=0 ? String(r[cR]||"").trim().toUpperCase().charAt(0) : "?",
      qt: cQt>=0 ? (r[cQt]??null) : null,
      fvm: cFvm>=0 ? (r[cFvm]??null) : null,
      fuoriSerieA,
    });
  }
  return giocatori;
}
function parseListoneWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const wsTutti = wb.Sheets["Tutti"]||wb.Sheets[wb.SheetNames[0]];
  const giocatori = parseListoneSheet(wsTutti, false);
  if(!giocatori.length) throw new Error("intestazione non riconosciuta (manca Id / Nome) nel foglio principale");

  // Foglio "Ceduti": giocatori usciti dalla Serie A, elencati a parte (stagione 2026-27).
  // Stessa struttura colonne del foglio Tutti, ma qui NON compaiono affatto in Tutti —
  // vanno aggiunti a parte, altrimenti spariscono del tutto dal listone (es. Lukaku).
  const wsCeduti = wb.Sheets["Ceduti"];
  if(wsCeduti){
    const ceduti = parseListoneSheet(wsCeduti, true);
    const giaPresenti = new Set(giocatori.map(g => g.id));
    for(const c of ceduti) if(!giaPresenti.has(c.id)) giocatori.push(c);
  }
  return giocatori;
}
function onListoneFile(input){
  const file=input.files && input.files[0]; if(!file){ return; }
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const giocatori=parseListoneWorkbook(e.target.result);
      if(!giocatori.length) throw new Error("nessun giocatore letto");
      S.listone={quando:new Date().toISOString(), giocatori};
      S.listoneById=new Map(giocatori.map(g=>[g.id,g]));
      // Propaga subito fuoriSerieA su S.byId: non aspettare che qualcuno importi
      // una rosa di lega (che è l'unico altro posto dove questo flag si aggiorna) —
      // un giocatore già in rosa da prima deve vedere il flag appena importi il listone.
      for(const g of giocatori){
        if(g.fuoriSerieA && S.byId.has(g.id)) S.byId.get(g.id).fuoriSerieA = true;
      }
      S._listoneReport={n:giocatori.length};
      saveLocal(); render();
    }catch(err){
      S._listoneReport={errore: err.message||String(err)};
      render();
    }
  };
  reader.onerror=()=>{ S._listoneReport={errore:"lettura del file non riuscita"}; render(); };
  reader.readAsArrayBuffer(file);
  input.value="";
}

function buildNameIndex(){
  const idx=new Map();
  for(const p of S.db){
    const k=normName(p.nome);
    if(!idx.has(k)) idx.set(k,[]);
    idx.get(k).push(p);
  }
  // Complemento dal listone ufficiale: un giocatore nuovo/marginale che lo scraper
  // statistiche non ha ancora tracciato (0 presenze) ma il listone quotazioni sì,
  // non deve far fallire il matching di una rosa lega.
  if(S.listone){
    for(const p of S.listone.giocatori){
      const k=normName(p.nome);
      if(idx.has(k)){
        // già in S.db: se il listone lo segnala uscito dalla Serie A, propaga
        // comunque il flag sulla scheda esistente (dati statistiche più ricchi,
        // ma senza questo campo).
        if(p.fuoriSerieA && S.byId.has(p.id)) S.byId.get(p.id).fuoriSerieA = true;
        continue;
      }
      const stub={id:p.id, nome:p.nome, squadra:p.squadra, ruolo:p.ruolo,
                  pv:0, mv:null, fm:0, gol:0, golSubiti:0, assist:0, qt:p.qt, fvm:p.fvm,
                  fuoriSerieA:p.fuoriSerieA};
      if(!S.byId.has(p.id)) S.byId.set(p.id, stub);
      idx.set(k,[stub]);
    }
  }
  return idx;
}
function parseLeagueWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets["TutteLeRose"]||wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true});
  const RS=new Set(["P","D","C","A"]); const teams={}; let league=null;
  for(const off of [0,5]){
    let cur=null;
    for(const r of rows){
      const a=(r[off]??"").toString().trim(), b=(r[off+1]??"").toString().trim();
      if(!a) continue;
      const low=a.toLowerCase();
      if(low.startsWith("rose lega")){ if(!league) league=a.replace(/rose lega/i,"").trim()||null; continue; }
      if(RS.has(a) && b){ if(cur) teams[cur].push({ruolo:a, nome:b, squadra:(r[off+2]??"").toString().trim()}); }
      else if(low!=="ruolo" && !a.startsWith("http") && !a.startsWith("*")){
        cur=a; if(!teams[cur]) teams[cur]=[];
      }
    }
  }
  const out={}; for(const k in teams){ if(teams[k].length>=15) out[k]=teams[k]; }
  return {league, teams:out};
}
function syncExtraNamesIntoById(){
  // Giocatori non riconosciuti durante un import (ID sintetico "x:nome") non sono mai
  // in S.db/players.json. Senza uno stub qui, roleOf(S.byId.get(id)) va in errore
  // (st undefined) e blocca il render a metà — bug reale riscontrato in produzione.
  if(!S.extraNames) return;
  for(const sid in S.extraNames){
    if(S.byId.has(sid)) continue;
    const ex = S.extraNames[sid];
    S.byId.set(sid, {id:sid, nome:ex.nome, squadra:ex.squadra||"", ruolo:"?",
      pv:0, mv:null, fm:0, gol:0, golSubiti:0, assist:0});
  }
}
function matchLeagueRoster(players, idx){
  const cods=[], missed=[];
  for(const p of players){
    const c=idx.get(normName(p.nome))||[];
    let ch=null;
    if(c.length===1) ch=c[0];
    else if(c.length>1) ch=c.find(x=>teamMatch(p.squadra,x.squadra))||c[0];
    if(ch && ch.id!=null){ cods.push(ch.id); }
    else {
      // giocatore non nel listone: NON lo perdo, gli do un id sintetico e ne ricordo il nome
      const sid = "x:" + normName(p.nome);
      cods.push(sid);
      if(!S.extraNames) S.extraNames = {};
      S.extraNames[sid] = { nome:p.nome, squadra:p.squadra||"" };
      missed.push(p.nome);
    }
  }
  return {cods, missed};
}
/* nome di un giocatore da un codice, anche se fuori listone */
function nomeDaCod(id){
  const st = S.byId.get(id);
  if(st) return {nome:st.nome, squadra:st.squadra||"", ruolo:roleOf(st), inDb:true};
  const ex = S.extraNames && S.extraNames[id];
  if(ex) return {nome:ex.nome, squadra:ex.squadra, ruolo:"?", inDb:false};
  return null;
}

function onLeagueFile(input){

/* ============================================================
   CALENDARIO DI LEGA — round-robin generato automaticamente
   (metodo del cerchio, andata+ritorno), editabile manualmente
   perché il vero sorteggio della lega può differire.
   ============================================================ */
function generateRoundRobin(teams){
  const list = [...teams];
  const bye = "(riposo)";
  if(list.length % 2 === 1) list.push(bye);
  const n = list.length, roundsAndata = n - 1;
  const cal = {};
  let arr = [...list];
  for(let r = 0; r < roundsAndata; r++){
    const giornata = r + 1;
    cal[giornata] = {};
    for(let i = 0; i < n/2; i++){
      const a = arr[i], b = arr[n-1-i];
      if(a !== bye && b !== bye){ cal[giornata][a] = b; cal[giornata][b] = a; }
    }
    arr = [arr[0], ...arr.slice(-1), ...arr.slice(1, -1)];   // ruota tutti tranne il primo
  }
  for(let r = 0; r < roundsAndata; r++){                     // ritorno: stessi accoppiamenti
    cal[roundsAndata + r + 1] = {...cal[r + 1]};
  }
  return cal;
}
function regenCalendario(){
  const teams = Object.keys(S.leagueRosters);
  if(teams.length < 2) return;
  const L = S.leagues[S.currentLeague];
  L.calendar = generateRoundRobin(teams);
  S.leagueCalendar = L.calendar;
  saveLocal(); render();
}
function setCalendarioMatch(giornata, team, opponent){
  const L = S.leagues[S.currentLeague];
  if(!L.calendar[giornata]) L.calendar[giornata] = {};
  const old = L.calendar[giornata][team];
  if(old) delete L.calendar[giornata][old === opponent ? team : old]; // ripulisce il vecchio avversario reciproco
  L.calendar[giornata][team] = opponent;
  L.calendar[giornata][opponent] = team;
  S.leagueCalendar = L.calendar;
  saveLocal(); render();
}
function numGiornateCalendario(){
  const g = Object.keys(S.leagueCalendar||{}).map(Number);
  return g.length ? Math.max(...g) : 0;
}
function oppOfCalendario(team, giornata){

function loadMyTeam(name){

function risincronizzaRosa(){
  // autoFlags/pTit vengono calcolati solo quando un giocatore ENTRA in rosa —
  // se i dati (indisponibili.json, titolarita_reale.json) si aggiornano dopo,
  // chi era già in rosa resta con i valori vecchi. Questa funzione riallinea
  // tutti i giocatori ai dati più recenti: SOVRASCRIVE eventuali correzioni
  // manuali già fatte (titolarità toccata a mano, flag alzati/abbassati a mano),
  // per questo è un'azione esplicita, non automatica.
  if(!S.roster || !S.roster.length) return;
  S.roster = S.roster.map(r => {
    const st = S.byId.get(r.id);
    if(!st) return r;   // giocatore sintetico/non riconosciuto: lascia stare
    const f = autoFlags(st);
    return {...r, pTit: Math.round(indiceTitolarita(st)*100), rig:f.rig, sq:f.sq, inf:f.inf};
  });
  saveLocal(); render();
}
// miglior formazione per una rosa qualunque (lista di elementi {id,pTit,rig,sq,inf})
function bestLineupFrom(roster, mod){
  const avail=roster.filter(r=>!r.sq&&!r.inf);
  // FORMAZIONE: Ordina per scheierability (valore QUANDO gioca)
  const by=role=>avail.filter(r=>roleOf(S.byId.get(r.id))===role).sort((a,b)=>scheierability(b)-scheierability(a));
  const xi=[...by("P").slice(0,1),...by("D").slice(0,mod.d),...by("C").slice(0,mod.c),...by("A").slice(0,mod.a)];
  const need=1+mod.d+mod.c+mod.a; const bench={};
  ROLES.forEach(role=>bench[role]=by(role).filter(r=>!xi.includes(r)));
  // Modificatore di difesa: bonus/malus UNICO alla squadra (non per giocatore), stimato sul
  // rating previsto di portiere + difensori schierati come proxy del "voto puro" (richiede difesa a 4+).
  const pRow = xi.find(r => roleOf(S.byId.get(r.id))==="P");
  const dRows = xi.filter(r => roleOf(S.byId.get(r.id))==="D");
  const votoP = pRow ? expFV(pRow).val : null;
  const votiD = dRows.map(r => expFV(r).val);
  const defModTeam = defModTeamBonus(votoP, votiD);
  // EV: Valore totale della formazione (quando i giocatori giocano) + modificatore di squadra
  return {xi, bench, complete:xi.length===need, defModTeam,
    ev: xi.reduce((s,r)=>s+scheierability(r),0) + defModTeam - (xi.length===need?0:99)};
}

/* ============================================================
   TOP 11 — miglior formazione REALMENTE giocata in una giornata già
   conclusa, usando voti_storico.json (non previsioni). Chi non ha
   votato quella giornata è escluso, non stimato.
   ============================================================ */
function bestLineupReal(playerIds, mod, giornata){
  const avail = playerIds
    .map(id => ({id, fv: realFV(id, giornata), v: realVoto(id, giornata)}))
    .filter(r => r.fv != null && S.byId.get(r.id));
  const by = role => avail.filter(r => roleOf(S.byId.get(r.id))===role).sort((a,b) => b.fv - a.fv);
  const xi = [...by("P").slice(0,1), ...by("D").slice(0,mod.d), ...by("C").slice(0,mod.c), ...by("A").slice(0,mod.a)];
  const need = 1+mod.d+mod.c+mod.a;
  const complete = xi.length === need;
  // Modificatore di difesa reale: media del VOTO PURO (v, non fantavoto) di portiere +
  // migliori 3 difensori schierati — richiede modulo con almeno 4 difensori.
  const pRow = xi.find(r => roleOf(S.byId.get(r.id))==="P");
  const dRows = xi.filter(r => roleOf(S.byId.get(r.id))==="D");
  const defModTeam = complete ? defModTeamBonus(pRow?.v, dRows.map(r => r.v)) : 0;
  return {xi, complete, defModTeam, total: complete ? xi.reduce((s,r) => s+r.fv, 0) + defModTeam : -Infinity};
}
function bestTop11ForTeam(playerIds, giornata){
  const ranking = MODULES.map(m => ({mod:m, lu:bestLineupReal(playerIds, m, giornata)}))
    .sort((a,b) => b.lu.total - a.lu.total);
  return ranking[0];
}
function pureTop11Total(playerIds, giornata){
  // Somma dei migliori 11 voti reali, SENZA capitano né modificatore di difesa —
  // stesso identico calcolo di bestTop11ForTeam ma senza le Regole Lega, per
  // restare confrontabile con la Formazione (universale, non legata a una lega).
  const best = bestTop11ForTeam(playerIds, giornata);
  return best.lu.complete ? best.lu.xi.reduce((s,r) => s+r.fv, 0) : null;
}
function sogliaStatistica(){
  const giornate = availableGiornate();
  if(!giornate.length || !S.leagueRosters) return 66;   // fallback: campionato fermo, nessun dato reale
  const totali = [];
  for(const g of giornate){
    for(const ids of Object.values(S.leagueRosters)){
      const t = pureTop11Total(ids, g);
      if(t != null) totali.push(t);
    }
  }
  if(!totali.length) return 66;
  return Math.round(totali.reduce((s,v)=>s+v,0) / totali.length);
}
function conteggioTop11(playerId, teamName){
  if(!teamName || !S.leagueRosters[teamName]) return null;   // fuori da un contesto lega: non calcolabile
  const ids = S.leagueRosters[teamName];
  let count = 0;
  for(const g of availableGiornate()){
    const best = bestTop11ForTeam(ids, g);
    if(best.lu.complete && best.lu.xi.some(r => r.id === playerId)) count++;
  }
  return count;
}
function computeTop11Standings(giornata){
  const rosters = S.leagueRosters || {};
  return Object.entries(rosters).map(([team, ids]) => {
    const best = bestTop11ForTeam(ids, giornata);
    let total = best.lu.complete ? best.lu.total : null;
    let captain = null, captainDelta = 0;
    if(total != null && S.leagueRules?.captain?.enabled && best.lu.xi.length){
      captain = best.lu.xi.reduce((b,r) => r.fv > b.fv ? r : b, best.lu.xi[0]);
      const adjusted = captainAdjustedValueReal(captain.v, captain.fv);
      captainDelta = adjusted - captain.fv;
      total += captainDelta;
    }
    return {team, mod:best.mod.name, lu:best.lu, total, captain, captainDelta};
  }).sort((a,b) => (b.total ?? -Infinity) - (a.total ?? -Infinity));
}

function bestOf(roster){
  const r=MODULES.map(m=>({mod:m,lu:bestLineupFrom(roster,m)})).filter(x=>x.lu.complete)
    .sort((a,b)=>b.lu.ev-a.lu.ev);
  return r[0]||null;
}
function oppRosterOf(name){
  return (S.leagueRosters[name]||[]).map(id=>{
    const st=S.byId.get(id), f=st?autoFlags(st):{sq:false,inf:false,rig:false};
    const defaultTit = st ? Math.round(indiceTitolarita(st)*100) : 75;
    return {id, pTit:defaultTit, rig:f.rig, sq:f.sq, inf:f.inf};
  });
}
function winProb(a, b, k=4000){       // P(a batte b) da due distribuzioni simulate
  let w=0,e=0; const na=a.length, nb=b.length;
  for(let i=0;i<k;i++){ const x=a[(Math.random()*na)|0], y=b[(Math.random()*nb)|0];
    if(x>y) w++; else if(x===y) e++; }
  return {win:w/k, draw:e/k};
}

  const byRole = {P:[],D:[],C:[],A:[]};

}
function histSVG(mc){
  const bins = 26, lo = mc.sorted[0], hi = mc.sorted[mc.sorted.length-1];
  const w = (hi-lo)/bins || 1, counts = new Array(bins).fill(0);
  mc.sorted.forEach(v => counts[Math.min(bins-1, Math.floor((v-lo)/w))]++);
  const maxC = Math.max(...counts);
  let bars = "";
  counts.forEach((c, i) => {
    const mid = lo + w*(i+.5), h = c/maxC*80;
    bars += `<rect x="${i*(340/bins)+1}" y="${86-h}" width="${340/bins-2}" height="${Math.max(h,2)}" rx="1.5"
      fill="${mid >= S.threshold ? "var(--fluo)" : "var(--line)"}"/>`;
  });
  return `<svg viewBox="0 0 340 90" style="width:100%; padding:0 14px; box-sizing:border-box">${bars}</svg>`;
}

let fcResult = null;
function spinFC(){
  const avail = S.roster.filter(r => !r.sq && !r.inf);
  const mod = MODULES[Math.floor(Math.random()*MODULES.length)];
  const pick = (role, n) => {
    const pool = avail.filter(r => roleOf(S.byId.get(r.id)) === role);
    for(let i = pool.length-1; i > 0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, n);
  };
  const xi = [...pick("P",1), ...pick("D",mod.d), ...pick("C",mod.c), ...pick("A",mod.a)];
  fcResult = {mod, lu:{xi}};
  render();
}

/* ---------- TAB: SPUNTI DI MERCATO ---------- */
/* ============================================================
   INDICE DI TITOLARITÀ (IT) — unica fonte di verità, usata sia da
   Rosa (default di pTit) sia da Formazione/Sfida (scheierability).

   IT = w·TS + (1-w)·consensus_fonti_reali   (quando le fonti reali sono disponibili)
   IT = TS                                    (altrimenti, es. fuori giornata)

   TS (storico): transizione graduale da rateo presenze stagione SCORSA
   a rateo presenze stagione CORRENTE, man mano che si accumulano giornate
   reali — esattamente come da specifica.
   ============================================================ */
const IT_PESO_STORICO = 0.12;    // w: peso di TS quando le fonti reali sono disponibili
const IT_STORICO_NEUTRO = 0.7;   // fallback: né storico né stagione corrente hanno segnale
function giornateAttualiGiocate(){
  const g = availableGiornate();
  return g.length ? g[0] : 0;
}
function tsOf(st){
  const giocate = giornateAttualiGiocate();
  const storico = S.storicoPresenze && S.storicoPresenze[st.id];
  const rateoStorico = storico ? storico.rateo : IT_STORICO_NEUTRO;
  if(giocate === 0) return rateoStorico;                       // stagione non ancora iniziata
  const rateoCorrente = Math.min(1, (st.pv||0) / giocate);
  const w = Math.min(1, giocate/38);                            // avanzando la stagione, pesa più il presente
  return w*rateoCorrente + (1-w)*rateoStorico;
}
function indiceTitolarita(st){
  // Segnale più forte di tutti: squalifica/infortunio confermati da fonte reale
  // (indisponibili.json) → quasi certamente non gioca, a prescindere da storico
  // o percentuale probabili formazioni (che potrebbe non essersi ancora aggiornata).
  const cat = S.indisponibili && S.indisponibili[st.squadra];
  const fuoriCerto = cat && (
    (cat.squalificati||[]).some(x => String(x.id) === String(st.id)) ||
    (cat.infortunati||[]).some(x => String(x.id) === String(st.id))
  );
  if(fuoriCerto) return 0.02;   // quasi zero, non esattamente 0 per non rompere eventuali divisioni altrove

  const ts = tsOf(st);
  const fonte = S.titolarita_reale && S.titolarita_reale[st.id];
  if(!fonte || fonte.confidence == null) return ts;             // nessuna fonte reale (es. fuori giornata)
  return IT_PESO_STORICO*ts + (1-IT_PESO_STORICO)*fonte.confidence;
}
const MKT_REG = 25;                       // presenze ~ titolare fisso in una stagione (legacy, vedi indiceTitolarita)
function availab(st){ return indiceTitolarita(st); }
function marketScore(st){                  // qualità × titolarità: chi non gioca non viene consigliato
  return (shrunk(st) + teamAdj(st)) * (0.15 + 0.85*availab(st));
}
function statsReady(){                     // i dati stagionali (fantamedie reali) sono disponibili?
  return S.db.filter(p => (p.fm||0) >= 4).length >= 30;
}
function mkRow(st, tag, tagColor, delta){
  const role=roleOf(st), av=Math.round(availab(st)*100);
  return `<div class="mkline">
    <span class="mrole" style="color:${ROLE_COLOR[role]}">${role}</span>

    ${delta!=null?`<span class="mkdelta ${delta>=0?"pos":"neg"}">${delta>=0?"+":""}${fmt(delta,2)}</span>`:""}
    ${tag?`<span class="mktag" style="color:${tagColor};border-color:${tagColor}">${tag}</span>`:""}
  </div>`;
}

/* ---------- routing ---------- */
const SOTTO_ALTRO = ["sfida","mercato","fattorec","cellha","listone","asta","regolelega","top11","calendariolega"];
const SOTTO_ASTA = ["piucomprati", "oggigiocherebbero", "oggigiocherebberosquadra"];
const SOTTO_FORMAZIONE = ["dettagliformazione"];

/* nome per il confronto: toglie l'iniziale puntata del nome (es. "Sucic P." → "sucic") */
function nomeCore(nome){
  return normName(String(nome).replace(/\b[A-Z]\.?\s*$/,"").replace(/\s+[A-Z]\.?\b/g,""));
}
/* distanza di edit (Levenshtein) per tollerare refusi tipo susic/sucic */
function editDist(a, b){
  const m=a.length, n=b.length;
  if(Math.abs(m-n) > 3) return 99;
  const dp=Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]
      : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
  }
  return dp[m][n];
}
/* un giocatore combacia con la query se la contiene, o se un pezzo del nome le somiglia */
function nomeMatch(nomeNorm, q){
  if(nomeNorm.includes(q)) return true;
  if(q.length < 4) return false;                 // troppo corta per il fuzzy
  // confronto la query con ogni parola del nome e col nome intero
  const soglia = q.length <= 5 ? 1 : 2;
  if(editDist(nomeNorm, q) <= soglia) return true;
  for(const parte of nomeNorm.split(/(?=[A-Z])| /)){
    if(parte.length>=4 && editDist(parte, q) <= soglia) return true;
  }
  return false;
}

/* ---- CHI CE L'HA: cerca un giocatore in tutte le leghe ---- */
function cellhaSearch(q){
  S._cellhaQ = q;
  render();
}
function renderCellHa(){
  const leghe = Object.keys(S.leagues||{});
  if(!leghe.length){
    el("main").innerHTML = `<h1>Chi ce l'ha</h1>
      <div class="empty">Per scoprire chi ha un giocatore servono le rose delle tue leghe.<br><br>
      <button class="btn primary" onclick="S.tab='rosa'; render()">Vai a Rosa → Importa</button></div>`;
    return;
  }
  const q = (S._cellhaQ||"").trim();
  const nq = normName(q);
  let risultati = "";
  if(nq.length >= 2){
    // candidati dal DB ufficiale (statistiche)
    const cand = S.db.filter(p => nomeMatch(nomeCore(p.nome), nq)).map(p=>({id:p.id, nome:p.nome, squadra:p.squadra, ruolo:roleOf(p), inDb:true}));
    const visti = new Set(cand.map(c=>c.id));
    // candidati dal listone ufficiale (anagrafica) non già presenti
    if(S.listone){
      for(const g of S.listone.giocatori){
        if(visti.has(g.id)) continue;
        if(nomeMatch(nomeCore(g.nome), nq)){
          cand.push({id:g.id, nome:g.nome, squadra:g.squadra, ruolo:g.ruolo||"?", inDb:true});
          visti.add(g.id);
        }
      }
    }
    // candidati fuori listone (presenti nelle rose ma non altrove)
    for(const sid in (S.extraNames||{})){
      if(visti.has(sid)) continue;
      if(nomeMatch(nomeCore(S.extraNames[sid].nome), nq))
        cand.push({id:sid, nome:S.extraNames[sid].nome, squadra:S.extraNames[sid].squadra, ruolo:"?", inDb:false});
    }
    cand.sort((a,b)=> a.nome.localeCompare(b.nome));
    const lista = cand.slice(0, 10);
    if(!lista.length){
      risultati = `<div class="empty" style="padding:24px 0">Nessun giocatore trovato per “${esc(q)}”.</div>`;
    } else {
      risultati = lista.map(p => {
        const trovato = [];
        for(const lega of leghe){
          const rosters = (S.leagues[lega].rosters)||{};
          for(const squadra in rosters){
            if((rosters[squadra]||[]).includes(p.id)) trovato.push({lega, squadra});
          }
        }
        const rc = ROLE_COLOR[p.ruolo] || "var(--dim)";
        const testa = `<div class="ch-player">
          <span class="ch-role" style="color:${rc}">${p.ruolo}</span>
          <b>${esc(p.nome)}</b><span class="ch-team">${esc(p.squadra||"")}${p.inDb?"":" · fuori listone"}</span></div>`;
        if(!trovato.length){
          return `<div class="card">${testa}
            <div class="ch-none">Svincolato in tutte le tue leghe</div></div>`;
        }
        const righe = trovato.map(t=>{
          const mio = (S.leagues[t.lega].myTeam === t.squadra);
          const msg = `${t.squadra}, fantalitico mi ricorda che hai ${p.nome}`;
          return `<div class="ch-hit${mio?' mine':''}">
            <span class="ch-lega">${esc(t.lega)}</span>
            <span class="ch-squadra">${esc(t.squadra)}${mio?' · tu':''}</span>
            <button class="ch-wa" onclick="waCellha(${JSON.stringify(msg).replace(/"/g,'&quot;')})" title="Prepara messaggio">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.8-1.5A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.2 14.8l-.3-.2-2.8.9.9-2.7-.2-.3A8 8 0 0 1 12 4zm4.5 10.4c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.2.1-.3 0-.5l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.7.7-.8 1.7-.3 2.8a8 8 0 0 0 3.7 3.9c1.6.8 2.3.7 3 .5.4-.1 1.2-.5 1.4-1 .2-.5.2-.9.1-1z"/></svg>
            </button></div>`;
        }).join("");
        return `<div class="card">${testa}${righe}</div>`;
      }).join("");
    }
  } else {
    risultati = `<div class="ch-hint">Scrivi il cognome di un giocatore per vedere chi lo ha nelle tue ${leghe.length} legh${leghe.length===1?'a':'e'}.</div>`;
  }

  el("main").innerHTML = `<h1>Chi ce l'ha</h1>
    <input class="ch-input" type="text" placeholder="Cerca un giocatore…" value="${esc(q)}"
      oninput="cellhaSearch(this.value)" autocomplete="off">
    ${risultati}`;
  // il campo perde il focus a ogni render: lo rimetto in fondo
  const inp = el("main").querySelector(".ch-input");
  if(inp){ inp.focus(); const v=inp.value; inp.value=""; inp.value=v; }
}
function waCellha(msg){
  window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
}

/* ================= APPUNTI PER L'ASTA ================= */
const ASTA_SLOT_DEF = {P:3, D:8, C:8, A:6};
const RUOLO_ORD = {P:0, D:1, C:2, A:3};

function astaInit(){
  if(!S.asta) S.asta = {budget:1000, slot:{...ASTA_SLOT_DEF}, giocatori:[]};
  return S.asta;
}
/* indice di schierabilità dal motore, se il giocatore è nel players.json */
function astaIndice(id){
  const st = S.byId.get(id);
  if(!st) return null;
  return expFV({id, pTit:100, rig:false}).val;   // valore "a pieno regime", solo come riferimento
}
function fvmOf(id){                              // FVM da listone: scala propria (proiezione asta), non un voto
  return S.listoneById?.get(id)?.fvm ?? null;
}
/* % massima suggerita da spendere: FVM del giocatore / somma FVM dei migliori
   N giocatori del suo ruolo (rosa standard 3P-8D-8C-6A) × fetta di budget del
   ruolo. Percentuali di ruolo: media di 5 fonti reali (Fantacalcio-Online su
   50.175 aste vere 2026/27, SOS Fanta, Aranzulla, regola tradizionale) —
   non inventate, cercate apposta. */
const RUOLO_BUDGET_SHARE = {P:0.07, D:0.17, C:0.29, A:0.47};
const RUOLO_TOP_N = {P:3, D:8, C:8, A:6};
function percMaxSuggerita(id){
  // Priorità 1: prezzo REALE misurato su migliaia d'aste vere (fantacalcio-online.com),
  // già in % del budget standard — molto più affidabile di una formula nostra.
  const reale = S.prezziRealiAsta?.[id];
  if(reale?.percMax != null) return reale.percMax;

  // Ripiego: stima da FVM/ripartizione-budget-per-ruolo, solo se un giocatore
  // non è coperto dalla fonte reale (es. nuovo arrivo, ancora poco tracciato).
  if(!S.listone) return null;
  const g = S.listoneById?.get(id);
  if(!g || g.fvm == null || !RUOLO_TOP_N[g.ruolo]) return null;
  const stessoRuolo = S.listone.giocatori.filter(p => p.ruolo === g.ruolo && p.fvm != null);
  const topN = [...stessoRuolo].sort((a,b) => b.fvm - a.fvm).slice(0, RUOLO_TOP_N[g.ruolo]);
  const somma = topN.reduce((s,p) => s + p.fvm, 0);
  if(somma <= 0) return null;
  const perc = (g.fvm / somma) * RUOLO_BUDGET_SHARE[g.ruolo] * 100;
  return Math.round(perc * 100) / 100;
}
function astaAdd(g){
  const a = astaInit();
  if(a.giocatori.some(x => x.id === g.id)) return false;   // già in lista
  a.giocatori.push({
    id:g.id, nome:g.nome, squadra:g.squadra||"", ruolo:g.ruolo||"?",
    qt: g.qt!=null ? g.qt : null,
    tit: "",          // titolarità: "T" titolare, "B" ballottaggio, "S" scommessa
    quota: null,      // crediti che sono disposto a spendere
    percMax: percMaxSuggerita(g.id),   // % suggerita dal calcolo FVM/ruolo — resta modificabile a mano
    stato: "obiettivo", // obiettivo | preso | sfumato
    prezzo: null,     // prezzo reale pagato
  });
  saveLocal();
  return true;
}
function astaPatch(id, campo, val){
  const a = astaInit();
  const g = a.giocatori.find(x => x.id === id);
  if(!g) return;
  g[campo] = val;
  saveLocal(); render();
}
function astaRemove(id){
  const a = astaInit();
  a.giocatori = a.giocatori.filter(x => x.id !== id);
  saveLocal(); render();
}
function astaPreso(id, prezzo){
  const a = astaInit();
  const g = a.giocatori.find(x => x.id === id);
  if(!g) return;
  g.stato = "preso"; g.prezzo = prezzo;
  saveLocal(); render();
}

function renderAsta(){
  const a = astaInit();
  const presi = a.giocatori.filter(g => g.stato === "preso");
  const spesi = presi.reduce((s,g) => s + (+g.prezzo || 0), 0);
  const restanti = a.budget - spesi;
  const perRuolo = r => presi.filter(g => g.ruolo === r).length;
  const slotTot = Object.values(a.slot).reduce((x,y)=>x+y,0);

  // riepilogo in alto
  let head = `<div class="asta-top">
    <div class="asta-big"><span class="v">${restanti}</span><span class="l">crediti su ${a.budget}</span></div>
    <div class="asta-slots">` +
    ["P","D","C","A"].map(r => {
      const n = perRuolo(r), tot = a.slot[r], full = n>=tot;
      return `<div class="asta-slot${full?' full':''}" style="border-color:${ROLE_COLOR[r]}">
        <span class="r" style="color:${ROLE_COLOR[r]}">${r}</span>
        <span class="n">${n}/${tot}</span></div>`;
    }).join("") +
    `</div></div>
    <div class="asta-bar"><div class="asta-fill" style="width:${Math.max(0,Math.min(100,100*spesi/a.budget))}%"></div></div>
    <div class="asta-sub">${presi.length}/${slotTot} giocatori presi · ${spesi} spesi</div>`;

  head += `<button class="btn" style="width:100%; padding:10px; margin-top:8px"
    onclick="S.tab='piucomprati'; render()">📊 Più comprati — prezzi medi reali</button>`;

  head += `<button class="btn" style="width:100%; padding:10px; margin-top:8px"
    onclick="S.tab='oggigiocherebbero'; render()">⚽ Oggi giocherebbero così — le 20 squadre</button>`;

  // barra di ricerca per aggiungere
  head += `<input class="ch-input" type="text" placeholder="Aggiungi un giocatore…" value="${esc(S._astaQ||"")}"
      oninput="S._astaQ=this.value; render()" autocomplete="off">`;

  // risultati ricerca (solo se sto scrivendo)
  const q = (S._astaQ||"").trim(), nq = normName(q);
  if(nq.length >= 2){
    const giaIn = new Set(a.giocatori.map(g=>g.id));
    let cand = [];
    const push = o => { if(!giaIn.has(o.id) && !cand.some(c=>c.id===o.id)) cand.push(o); };
    // dal listone (fonte principale in fase d'asta)
    if(S.listone) for(const g of S.listone.giocatori)
      if(nomeMatch(nomeCore(g.nome), nq)) push({id:g.id, nome:g.nome, squadra:g.squadra, ruolo:g.ruolo, qt:g.qt});
    // dal players.json (se manca il listone)
    for(const p of S.db)
      if(nomeMatch(nomeCore(p.nome), nq)) push({id:p.id, nome:p.nome, squadra:p.squadra, ruolo:roleOf(p), qt:null});
    cand = cand.slice(0, 8);
    head += `<div class="asta-cerca">` + (cand.length
      ? cand.map(o => `<div class="asta-hit" onclick="if(astaAdd(${JSON.stringify(o).replace(/"/g,'&quot;')})){S._astaQ='';} render()">
          <span class="ch-role" style="color:${ROLE_COLOR[o.ruolo]||'var(--dim)'}">${o.ruolo}</span>
          <b>${esc(o.nome)}</b><span class="ch-team">${esc(o.squadra||"")}${o.qt!=null?` · ${o.qt}`:""}</span>
          <span class="asta-plus">+</span></div>`).join("")
      : `<div class="ch-hint" style="padding:10px 0">Nessun giocatore per “${esc(q)}”.</div>`)
      + `</div>`;
  }

  // lista raggruppata per ruolo
  let corpo = "";
  const attivi = a.giocatori.filter(g => g.stato !== "sfumato");
  if(!attivi.length && nq.length < 2){
    corpo = `<div class="empty" style="margin-top:20px">La tua lista è vuota.<br>Cerca un giocatore qui sopra per aggiungerlo agli obiettivi.</div>`;
  } else {
    for(const r of ["P","D","C","A"]){
      const gs = a.giocatori.filter(g => g.ruolo === r).sort((x,y)=>{
        if((x.stato==="preso")!==(y.stato==="preso")) return x.stato==="preso"?1:-1;
        return (y.quota||0)-(x.quota||0);
      });
      if(!gs.length) continue;
      corpo += `<div class="asta-rgroup"><span style="color:${ROLE_COLOR[r]}">${ROLE_LABEL[r]}</span>
        <span class="asta-rcount">${perRuolo(r)}/${a.slot[r]}</span></div>`;
      corpo += gs.map(g => astaCard(g)).join("");
    }
  }

  el("main").innerHTML = `<h1>Appunti per l'asta</h1>${head}${corpo}`;
  const inp = el("main").querySelector(".ch-input");
  if(inp && document.activeElement !== inp && (S._astaQ||"").length){ inp.focus(); const v=inp.value; inp.value=""; inp.value=v; }
}

  const titBtns = ["T","B","S"].map(t => {
    const nuovo = g.tit===t ? "''" : "'"+t+"'";
    return `<button class="asta-tit${g.tit===t?' on':''}" onclick="astaPatch(${JSON.stringify(g.id)},'tit',${nuovo})">${t}</button>`;
  }).join("");

  return `<div class="asta-card${preso?' preso':''}">
    <div class="asta-row1">
      <b>${esc(g.nome)}</b>
      <span class="asta-team">${esc(g.squadra||"")}</span>

      ${g.qt!=null?`<span class="asta-tag">Qt ${g.qt}</span>`:""}

      ${fvm!=null?`<span class="asta-tag" title="FantaVoto Medio proiettato (listone ufficiale)">FVM ${fvm}</span>`:""}
      ${(ind==null&&fvm==null)?`<span class="asta-tag off">no stats</span>`:""}
      <span class="asta-tit-wrap">${titBtns}</span>
    </div>
    ${preso
      ? `<div class="asta-row3 done">Preso a <b>${g.prezzo}</b> crediti
           <button class="asta-undo" onclick="astaPatch(${JSON.stringify(g.id)},'stato','obiettivo')">annulla</button></div>`

         </div>

           <span class="asta-buy" style="margin-left:0; width:100%; justify-content:flex-end">
             <input type="number" inputmode="numeric" placeholder="prezzo" id="pz_${String(g.id).replace(/[^a-zA-Z0-9]/g,'')}" class="asta-prezzo">
             <button class="asta-preso" onclick="astaPresoDaInput(${JSON.stringify(g.id)})">Preso</button>
           </span>
         </div>`}
  </div>`;
}

function renderTop11(){
  const giornate = availableGiornate();
  if(!giornate.length){
    el("main").innerHTML = `<div class="empty">${ill("formazione")}Nessun voto reale ancora disponibile.<br>
      Torna qui dopo la prima giornata giocata della stagione.</div>`;
    return;
  }
  if(!S.currentLeague || !S.leagueRosters || !Object.keys(S.leagueRosters).length){
    el("main").innerHTML = `<div class="empty">${ill("formazione")}Il Top 11 confronta le rose di una lega.<br>
      Seleziona o importa una lega dalla Rosa per vederlo.</div>`;
    return;
  }
  if(!S.top11Giornata || !giornate.includes(S.top11Giornata)) S.top11Giornata = giornate[0];
  const g = S.top11Giornata;
  const standings = computeTop11Standings(g);
  if(!S.top11SelTeam || !standings.find(s => s.team === S.top11SelTeam)){
    S.top11SelTeam = standings.find(s => s.total != null)?.team || standings[0]?.team || null;
  }
  const sel = standings.find(s => s.team === S.top11SelTeam);

  el("main").innerHTML = `
    <div class="modscroll">${giornate.map(gn =>
      `<div class="modbtn ${gn===g?"on":""}" onclick="S.top11Giornata=${gn}; render()">
        <div class="n">G${gn}</div></div>`).join("")}
    </div>
    <div class="card" style="padding:14px">
      <div class="l" style="margin-bottom:8px">CLASSIFICA TOP 11 · GIORNATA ${g}</div>
      ${standings.map((s,i) => `
        <div onclick="S.top11SelTeam='${esc(s.team)}'; render()"
          style="display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid var(--line);
          cursor:pointer; ${s.team===S.top11SelTeam?"background:var(--bg2); border-radius:8px":""}">
          <div style="width:22px; text-align:center; font-weight:900; color:${i===0?"var(--amber)":"var(--dim)"}">${i+1}</div>
          <div style="flex:1">
            <div style="font-weight:700; color:var(--chalk)">${esc(s.team)}</div>
            <div class="sub" style="margin:0">${s.total!=null ? s.mod : "formazione incompleta"}</div>
          </div>
          <div style="font-weight:900; font-size:17px; color:${s.total!=null?"var(--fluo)":"var(--dim)"}">
            ${s.total!=null ? fmt(s.total,1) : "n/d"}</div>
        </div>`).join("")}
    </div>
    ${sel && sel.total!=null ? `
    <div class="card">
      <div class="bighead">
        <div><div class="l">Formazione reale</div>
          <div class="v" style="color:var(--fluo)">${esc(sel.team)}</div></div>
        <div style="text-align:right"><div class="l">totale reale</div>
          <div class="v">${fmt(sel.total,1)}</div></div>
      </div>
      <div style="padding:8px">${pitchSVG(sel.lu, MODULES.find(m=>m.name===sel.mod), sel.captain?.id, r => r.fv)}</div>
      ${S.leagueRules.defMod.enabled ? `<div class="sub" style="padding:0 14px 6px; text-align:center">
        🛡️ Modificatore Difesa: <b style="color:var(--chalk)">${signedSpan(sel.lu.defModTeam||0,1)}</b> alla squadra</div>` : ""}
      ${sel.captain ? `<div class="sub" style="padding:0 14px 10px; text-align:center">
        🎖 Capitano: <b style="color:var(--chalk)">${esc(S.byId.get(sel.captain.id).nome)}</b>
        → +${fmt(sel.captainDelta,1)} al totale</div>` : ""}
    </div>` : sel ? `<div class="empty">${ill("formazione")}${esc(sel.team)} non aveva abbastanza giocatori
      con voto reale in giornata ${g} per completare nessun modulo.</div>` : ""}
  `;
}
function renderCalendarioLega(){
  const teams = Object.keys(S.leagueRosters||{});
  if(teams.length < 2){
    el("main").innerHTML = `<div class="empty">${ill("formazione")}Serve una lega con almeno 2 squadre importate.<br>
      <button class="btn primary" onclick="S.tab='rosa'; render()">Vai a Rosa → Importa</button></div>`;
    return;
  }
  const nGiornate = numGiornateCalendario();
  if(!nGiornate){
    el("main").innerHTML = `<div class="empty">${ill("formazione")}Nessun calendario ancora generato per <b>${esc(S.currentLeague)}</b>.<br><br>
      <button class="btn primary" onclick="regenCalendario()">Genera calendario automatico</button><br>
      <p class="sub" style="margin-top:10px">Round-robin andata+ritorno tra le ${teams.length} squadre.
      Potrai correggere le partite a mano se il vero sorteggio della lega è diverso.</p></div>`;
    return;
  }
  let html = `<h1>Calendario Lega</h1>
    <p class="sub" style="margin:0 0 14px">${esc(S.currentLeague)} · ${nGiornate} giornate.
    Modifica le tendine se il sorteggio reale della tua lega è diverso da quello generato.</p>
    <button class="btn" style="margin-bottom:14px" onclick="if(confirm('Rigenerare da zero? Le modifiche manuali andranno perse.')) regenCalendario()">↻ Rigenera automatico</button>`;

  for(let g = 1; g <= nGiornate; g++){
    const partite = S.leagueCalendar[g] || {};
    const viste = new Set();
    html += `<div class="card" style="padding:12px 14px; margin-bottom:8px">
      <div class="l" style="margin-bottom:8px">GIORNATA ${g}</div>`;
    for(const team of teams){
      if(viste.has(team)) continue;
      const opp = partite[team];
      if(!opp) continue;
      viste.add(team); viste.add(opp);
      const altre = teams.filter(t => t !== team);
      html += `<div style="display:flex; align-items:center; gap:8px; padding:6px 0">
        <div style="flex:1; font-weight:700; color:var(--chalk); ${team===S.myTeamName?"color:var(--fluo)":""}">${esc(team)}</div>
        <div style="color:var(--dim); font-size:12px">vs</div>
        <select style="flex:1; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--chalk); font-family:inherit"
          onchange="setCalendarioMatch(${g}, '${team.replace(/'/g,"\\'")}', this.value)">
          ${altre.map(t => `<option value="${esc(t)}" ${t===opp?"selected":""}>${esc(t)}</option>`).join("")}
        </select>
      </div>`;
    }
    const riposa = teams.filter(t => !viste.has(t));
    if(riposa.length) html += `<div class="sub" style="margin-top:4px">Riposa: ${riposa.map(esc).join(", ")}</div>`;
    html += `</div>`;
  }
  el("main").innerHTML = html;
}
