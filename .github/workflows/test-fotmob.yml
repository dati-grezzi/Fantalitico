name: Test FotMob (temporaneo)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
      - uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        run: pip install requests
      - name: Test FotMob
        run: python fotmob_pull.py
