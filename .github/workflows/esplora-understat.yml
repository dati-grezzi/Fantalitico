name: Sonda Understat (manuale)

# Workflow di diagnosi, non fa parte della pipeline: si lancia a mano dal tab
# Actions quando serve capire dove Understat tiene un dato. Non scrive file e
# non committa niente — stampa e basta.
#
# Nato l'1/09/2026: la tabella di lega espone solo
#   №, Player, Team, Apps, Min, G, A, xG, xA, xG90, xA90
# e mancano i tiri, che sono il segnale col peso più alto del bonus
# performance per gli attaccanti.

on:
  workflow_dispatch:

jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa Playwright
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Cerca i tiri su Understat
        run: python understat_esplora.py
