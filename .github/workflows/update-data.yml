name: Aggiorna dati Fantalitico

on:
  schedule:
    # Lunedì 05:00 UTC (dopo la giornata) e venerdì 12:00 UTC (prima della giornata,
    # per classifica, rigoristi e indisponibili aggiornati)
    - cron: "0 6 * * *"    # ogni giorno, 6:00 UTC
    - cron: "0 18 * * *"   # ogni giorno, 18:00 UTC (notizie formazioni tardo pomeriggio)
  workflow_dispatch:   # avvio manuale dal tab Actions
    inputs:
      giornata:
        description: "Numero giornata di cui scaricare i voti reali (lascia vuoto per saltare questo step)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0

      - uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui scraper fantacalcio.it (statistiche stagionali)
        run: python scraper.py

      - name: Installa Playwright (titolarità/indisponibili sono caricati via JS)
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Probabili formazioni (titolarità + calendario + indisponibili)
        run: python probabili_formazioni_scraper.py

      - name: Indisponibili da SOS Fanta (sostituisce quelli di fantacalcio.it, fonte più affidabile)
        run: python sosfanta_indisponibili_scraper.py

      - name: Titolarità da SOS Fanta (seconda fonte per il consensus)
        run: python sosfanta_titolarita_scraper.py

      - name: Prezzi reali d'asta da Fantacalcio-Online (sostituisce la stima FVM per il Max % in Asta)
        run: python fantacalcio_online_scraper.py

      - name: Consensus titolarità (fantacalcio.it + sosfanta.com)
        run: python titolarita_consensus.py

      # UNDERSTAT TEMPORANEAMENTE DISABILITATO (fuori stagione)
      # - name: Esegui scraper Understat
      #   run: python understat_pull.py
      #   continue-on-error: true
      # - name: Elabora Understat (CSV → JSON)
      #   run: python understat_process.py
      #   continue-on-error: true

      - name: Commit dei JSON aggiornati
        run: |
          git config user.name "fantalitico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Dati aggiornati $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  voti-giornata:
    # Job separato: gira SOLO se lanci manualmente il workflow specificando il
    # numero di giornata. Scarica i voti reali (3 redazioni) di quella giornata
    # e li integra nello storico data/voti_storico.json.
    if: github.event_name == 'workflow_dispatch' && inputs.giornata != ''
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
        with:
          ref: main   # riparte dal commit appena pushato dal job 'update'

      - uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.12"

      - name: Installa Playwright
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Scarica voti giornata ${{ inputs.giornata }}
        run: python voti_giornata_scraper_v2.py ${{ inputs.giornata }}

      - name: Integra nello storico
        run: python integra_voti_storico.py data/voti_giornata_${{ inputs.giornata }}.json ${{ inputs.giornata }}

      - name: Commit voti storico aggiornato
        run: |
          git config user.name "fantalitico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/voti_storico.json data/voti_giornata_${{ inputs.giornata }}.json
          git diff --cached --quiet || git commit -m "Voti giornata ${{ inputs.giornata }} integrati $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
