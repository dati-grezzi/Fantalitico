name: Aggiorna dati Fantalitico

on:
  schedule:
    # Lunedì 05:00 UTC (dopo la giornata) e venerdì 12:00 UTC (prima della giornata,
    # per classifica, rigoristi e indisponibili aggiornati)
    - cron: "0 6 * * *"    # ogni giorno, 6:00 UTC
    - cron: "0 18 * * *"   # ogni giorno, 18:00 UTC (notizie formazioni tardo pomeriggio)
  workflow_dispatch:   # avvio manuale dal tab Actions
    inputs:
      giornata:
        description: "Numero giornata di cui scaricare i voti reali (lascia vuoto per saltare questo step)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0

      - uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Installa Playwright (titolarità/indisponibili/statistiche sono caricati via JS)
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Esegui scraper fantacalcio.it (statistiche stagionali)
        run: python scraper.py
        timeout-minutes: 3  # rete di sicurezza: non deve mai più restare bloccato a lungo (successo il 25/08, 12 min)
        continue-on-error: true  # se scade il tempo, il resto della pipeline continua comunque (players.json resta quello precedente)

      - name: Probabili formazioni (titolarità + calendario + indisponibili)
        run: python probabili_formazioni_scraper.py

      - name: Indisponibili da SOS Fanta (sostituisce quelli di fantacalcio.it, fonte più affidabile)
        run: python sosfanta_indisponibili_scraper.py

      - name: Titolarità da SOS Fanta (seconda fonte per il consensus)
        run: python sosfanta_titolarita_scraper.py

      - name: Prezzi reali d'asta da Fantacalcio-Online (sostituisce la stima FVM per il Max % in Asta)
        run: python fantacalcio_online_scraper.py

      - name: Consensus titolarità (fantacalcio.it + sosfanta.com)
        run: python titolarita_consensus.py

      # UNDERSTAT riattivato il 25/08 — il sito ha finalmente pubblicato la
      # pagina 2026-27. continue-on-error resta attivo: se i loro dati non
      # fossero ancora completi per la Giornata 1, non deve bloccare il resto.
      - name: Esegui scraper Understat
        run: python understat_pull.py
        continue-on-error: true

      - name: Elabora Understat (CSV → JSON)
        run: python understat_process.py
        continue-on-error: true

      # SOFASCORE: NON automatizzato (28/08) — confermato bloccato dagli IP
      # dei server GitHub Actions anche passando da un proxy gratuito
      # (403 "challenge"). sofascore_pull.py e sofascore_process.py restano
      # nel repo per uso manuale dal tuo PC (unica fonte per saves_box_p90
      # dei portieri, che playerstats.football non copre).

      # PLAYERSTATS.FOOTBALL (28/08) — fonte AUTOMATICA per tackle/intercetti/
      # rinvii/duelli (verificato con dati veri prima di scrivere il codice,
      # nessun blocco riscontrato). Copre i primi 50 per categoria, non tutti
      # i giocatori — normale, non un errore.
      - name: Esegui scraper playerstats.football
        run: python playerstats_pull.py
        continue-on-error: true

      - name: Elabora playerstats.football (JSON → JSON)
        run: python playerstats_process.py
        continue-on-error: true

      - name: Commit dei JSON aggiornati
        run: |
          git config user.name "fantalitico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Dati aggiornati $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

  voti-giornata:
    # Gira SEMPRE (non più solo su lancio manuale) — uno step interno decide
    # da solo se c'è davvero una giornata da processare, guardando quale
    # giornata è "in vetrina" sul calendario (quella successiva alla più
    # recente conclusa) e se è già stata integrata nello storico. Lasciato
    # comunque disponibile l'override manuale (campo "giornata" su Run
    # workflow) per un eventuale recupero.
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0
        with:
          ref: main   # riparte dal commit appena pushato dal job 'update'

      - uses: actions/setup-python@v5.2.0
        with:
          python-version: "3.12"

      - name: Determina se c'è una giornata da processare
        id: determina
        env:
          GIORNATA_MANUALE: ${{ inputs.giornata }}
        run: python determina_giornata_voti.py

      - name: Installa Playwright
        if: steps.determina.outputs.giornata != ''
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Scarica voti giornata ${{ steps.determina.outputs.giornata }}
        if: steps.determina.outputs.giornata != ''
        run: python voti_giornata_scraper_v2.py ${{ steps.determina.outputs.giornata }}

      - name: Integra nello storico
        if: steps.determina.outputs.giornata != ''
        run: python integra_voti_storico.py data/voti_giornata_${{ steps.determina.outputs.giornata }}.json ${{ steps.determina.outputs.giornata }}

      - name: Commit voti storico aggiornato
        if: steps.determina.outputs.giornata != ''
        run: |
          git config user.name "fantalitico-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/voti_storico.json data/voti_giornata_${{ steps.determina.outputs.giornata }}.json
          git diff --cached --quiet || git commit -m "Voti giornata ${{ steps.determina.outputs.giornata }} integrati $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
